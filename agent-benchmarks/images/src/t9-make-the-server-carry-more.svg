<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 586" width="1000" height="586" role="img" aria-label="Make the whole server carry more">
<style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .n  { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .d  { font: 400 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .m  { font: 600 11px ui-monospace, Menlo, monospace; }
    .cap { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c2cd; }
    .rule { stroke: #2e3a47; stroke-width: 1; }
    .box { fill: #1b2531; stroke: #3d4956; stroke-width: 1.5; }
    .good { fill: #14301f; stroke: #5cc48a; stroke-width: 1.8; }
    .bad { fill: #2a1a1c; stroke: #e5646c; stroke-width: 1.8; }
    .blue { fill: #16314a; stroke: #5aa9e6; stroke-width: 1.8; }
    .amber { fill: #3a2c14; stroke: #f2a541; stroke-width: 1.8; }
    .purple { fill: #2a2140; stroke: #a98be8; stroke-width: 1.8; }
    .g { fill: #5cc48a; } .r { fill: #e5646c; } .b { fill: #5aa9e6; } .a { fill: #f2a541; } .w { fill: #dfe6ee; } .s { fill: #8a97a6; } .p { fill: #a98be8; }
    .arrow { stroke: #8a97a6; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .arrowb { stroke: #5aa9e6; stroke-width: 1.8; fill: none; marker-end: url(#ahb); }
    .arrowg { stroke: #5cc48a; stroke-width: 1.8; fill: none; marker-end: url(#ahg); }
    .arrowa { stroke: #f2a541; stroke-width: 1.8; fill: none; marker-end: url(#aha); }
    .arrowr { stroke: #e5646c; stroke-width: 1.8; fill: none; marker-end: url(#ahr); }
  .rowa{fill:#1b2531}.rowb{fill:#161d26;stroke:#2e3a47;stroke-width:1}.c{font:400 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#dfe6ee}.n{font-size:12px}</style>
<rect class="bg" width="1000" height="586" rx="6"/>
<text class="h" x="24" y="36">Make the whole server carry more</text>
<rect class="box" x="24" y="58" width="952" height="33" rx="3"/><text class="n" x="36" y="80">Change</text><text class="n" x="296" y="80">What it does, in plain words</text><text class="n" x="556" y="80">Before and after (example)</text><text class="n" x="815" y="80">Risk</text><rect class="rowa" x="24" y="95" width="952" height="67" rx="3"/><text class="n" x="36" y="117">More users in each step</text><text class="n" x="36" y="134">(--max-num-seqs,</text><text class="n" x="36" y="151">--max-num-batched-tokens)</text><text class="c" x="296" y="117">One read of the weights serves every</text><text class="c" x="296" y="134">user in the step, like the bus in</text><text class="c" x="296" y="151">B.1.</text><text class="c" x="556" y="117">1 user: 120 tokens per second in</text><text class="c" x="556" y="134">total. 32 users: about 1,900 in</text><text class="c" x="556" y="151">total (figure in B.1).</text><text class="c" x="815" y="117">Each user gets slower.</text><rect class="rowb" x="24" y="166" width="952" height="101" rx="3"/><text class="n" x="36" y="188">More memory for the KV cache</text><text class="n" x="36" y="205">(--gpu-memory-utilization in vLLM,</text><text class="n" x="36" y="222">--mem-fraction-static in SGLang)</text><text class="c" x="296" y="188">The KV cache is the memory that</text><text class="c" x="296" y="205">holds the notes for every token of</text><text class="c" x="296" y="222">every active request. More KV memory</text><text class="c" x="296" y="239">means more requests fit at the same</text><text class="c" x="296" y="256">time.</text><text class="c" x="556" y="188">Before: room for 20 requests. After:</text><text class="c" x="556" y="205">room for 30.</text><text class="c" x="815" y="188">Too much can run the</text><text class="c" x="815" y="205">GPU out of memory.</text><rect class="rowa" x="24" y="271" width="952" height="50" rx="3"/><text class="n" x="36" y="293">FP8 KV cache (--kv-cache-dtype</text><text class="n" x="36" y="310">fp8)</text><text class="c" x="296" y="293">Store those notes in 1 byte in place</text><text class="c" x="296" y="310">of 2.</text><text class="c" x="556" y="293">About twice as many requests fit.</text><text class="c" x="815" y="293">Small quality loss on</text><text class="c" x="815" y="310">some models. Test it.</text><rect class="rowb" x="24" y="325" width="952" height="84" rx="3"/><text class="n" x="36" y="347">Prefix caching</text><text class="c" x="296" y="347">Keep the KV notes of prompt</text><text class="c" x="296" y="364">beginnings that repeat, for example</text><text class="c" x="296" y="381">a long system prompt. Do not read</text><text class="c" x="296" y="398">them again.</text><text class="c" x="556" y="347">A shared 5,000-token system prompt</text><text class="c" x="556" y="364">is read once, not once for every</text><text class="c" x="556" y="381">request. Much lower TTFT.</text><text class="c" x="815" y="347">Uses memory.</text><rect class="rowa" x="24" y="413" width="952" height="84" rx="3"/><text class="n" x="36" y="435">Chunked prefill</text><text class="c" x="296" y="435">Cut a long prompt into pieces and</text><text class="c" x="296" y="452">mix them with decode work, so one</text><text class="c" x="296" y="469">long prompt does not freeze everyone</text><text class="c" x="296" y="486">else.</text><text class="c" x="556" y="435">Steadier speed for users who are</text><text class="c" x="556" y="452">already receiving an answer.</text><text class="c" x="815" y="435">Can raise TTFT a little</text><text class="c" x="815" y="452">for the long prompt.</text><rect class="rowb" x="24" y="501" width="952" height="67" rx="3"/><text class="n" x="36" y="523">More copies of the model (data</text><text class="n" x="36" y="540">parallel)</text><text class="c" x="296" y="523">Run several copies of the model on</text><text class="c" x="296" y="540">more GPUs, and share the users</text><text class="c" x="296" y="557">between them.</text><text class="c" x="556" y="523">2 copies: about 2x the total.</text><text class="c" x="815" y="523">Needs more GPUs.</text>
</svg>
