<rect class="bg" width="800" height="372" rx="6"/>
<text class="h" x="24" y="34">Two topics in one article</text>
<text class="t" x="776" y="34" text-anchor="end">OVERVIEW</text>
<rect class="amber" x="24" y="56" width="360" height="250" rx="6"/><text class="n" x="40" y="84">Part A: how good is the coding agent?</text><text class="d" x="40" y="116">the question</text><text class="n" x="40" y="133" style="font-size:12px">Does it fix the bug? Does it finish the task?</text><text class="d" x="40" y="154">what changes the answer</text><text class="n" x="40" y="171" style="font-size:12px">the model, the harness, the server settings</text><text class="d" x="40" y="192">unit</text><text class="n" x="40" y="209" style="font-size:12px">pass@1: percent of tasks solved</text><text class="d" x="40" y="230">tools</text><text class="n" x="40" y="247" style="font-size:12px">SWE-bench, Terminal-Bench, Aider, LiveCodeBench</text><text class="d" x="40" y="268">leaderboards</text><text class="n" x="40" y="285" style="font-size:12px">SWE-bench, Terminal-Bench, Aider, LMArena</text><rect class="blue" x="416" y="56" width="360" height="250" rx="6"/><text class="n" x="432" y="84">Part B: how fast does the server make tokens?</text><text class="d" x="432" y="116">the question</text><text class="n" x="432" y="133" style="font-size:12px">How many tokens per second, for each user and in total?</text><text class="d" x="432" y="154">what changes the answer</text><text class="n" x="432" y="171" style="font-size:12px">the GPU, the engine (vLLM, SGLang), its settings</text><text class="d" x="432" y="192">unit</text><text class="n" x="432" y="209" style="font-size:12px">TPS, TTFT, total throughput</text><text class="d" x="432" y="230">tools</text><text class="n" x="432" y="247" style="font-size:12px">vllm bench serve, sglang.bench_serving</text><text class="d" x="432" y="268">leaderboards</text><text class="n" x="432" y="285" style="font-size:12px">Artificial Analysis, OpenRouter, MLPerf</text><text class="cap" x="24" y="336">Two separate measurements. A model can be clever and slow, or fast and weak. TPS is the same idea for chat,</text><text class="cap" x="24" y="356">agents, RAG or batch jobs. Part C shows the one place where the two meet: agent task time.</text>
</svg>
