<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 324" width="800" height="324" role="img" aria-label="Five coding agent leaderboards, what each ranks and who runs the test">
<style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .n  { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .d  { font: 400 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .m  { font: 600 11px ui-monospace, Menlo, monospace; }
    .cap { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c2cd; }
    .rule { stroke: #2e3a47; stroke-width: 1; }
    .box { fill: #1b2531; stroke: #3d4956; stroke-width: 1.5; }
    .good { fill: #14301f; stroke: #5cc48a; stroke-width: 1.8; }
    .bad { fill: #2a1a1c; stroke: #e5646c; stroke-width: 1.8; }
    .blue { fill: #16314a; stroke: #5aa9e6; stroke-width: 1.8; }
    .amber { fill: #3a2c14; stroke: #f2a541; stroke-width: 1.8; }
    .purple { fill: #2a2140; stroke: #a98be8; stroke-width: 1.8; }
    .g { fill: #5cc48a; } .r { fill: #e5646c; } .b { fill: #5aa9e6; } .a { fill: #f2a541; } .w { fill: #dfe6ee; } .s { fill: #8a97a6; } .p { fill: #a98be8; }
    .arrow { stroke: #8a97a6; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .arrowb { stroke: #5aa9e6; stroke-width: 1.8; fill: none; marker-end: url(#ahb); }
    .arrowg { stroke: #5cc48a; stroke-width: 1.8; fill: none; marker-end: url(#ahg); }
    .arrowa { stroke: #f2a541; stroke-width: 1.8; fill: none; marker-end: url(#aha); }
    .arrowr { stroke: #e5646c; stroke-width: 1.8; fill: none; marker-end: url(#ahr); }
  </style><defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a97a6"/></marker>
    <marker id="ahb" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5aa9e6"/></marker>
    <marker id="ahg" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5cc48a"/></marker>
    <marker id="aha" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f2a541"/></marker>
    <marker id="ahr" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e5646c"/></marker>
  </defs>
<rect class="bg" width="800" height="324" rx="6"/>
<text class="h" x="24" y="34">Coding agent leaderboards</text>
<text class="t" x="776" y="34" text-anchor="end">AGENT QUALITY</text>
<text class="n" x="24" y="66" style="font-size:12px">leaderboard</text><text class="n" x="200" y="66" style="font-size:12px">what it ranks</text><text class="n" x="510" y="66" style="font-size:12px">who runs the test</text><rect class="amber" x="24" y="78" width="752" height="32" rx="4"/><text class="n" x="38" y="99" style="font-size:12.5px">SWE-bench</text><text class="d" x="200" y="99" style="fill:#dfe6ee">real GitHub issues fixed</text><text class="d" x="510" y="99">you run it, then submit logs</text><rect class="amber" x="24" y="118" width="752" height="32" rx="4"/><text class="n" x="38" y="139" style="font-size:12.5px">Terminal-Bench</text><text class="d" x="200" y="139" style="fill:#dfe6ee">tasks in a real terminal</text><text class="d" x="510" y="139">you run it, then submit</text><rect class="amber" x="24" y="158" width="752" height="32" rx="4"/><text class="n" x="38" y="179" style="font-size:12.5px">Aider Polyglot</text><text class="d" x="200" y="179" style="fill:#dfe6ee">225 exercises, 6 languages, cost</text><text class="d" x="510" y="179">you run it, then open a PR</text><rect class="purple" x="24" y="198" width="752" height="32" rx="4"/><text class="n" x="38" y="219" style="font-size:12.5px">LiveCodeBench</text><text class="d" x="200" y="219" style="fill:#dfe6ee">new contest problems, by date</text><text class="d" x="510" y="219">maintainers or you run it</text><rect class="good" x="24" y="238" width="752" height="32" rx="4"/><text class="n" x="38" y="259" style="font-size:12.5px">LMArena WebDev</text><text class="d" x="200" y="259" style="fill:#dfe6ee">human votes between two answers</text><text class="d" x="510" y="259">users vote; the team adds models</text><text class="cap" x="24" y="308">amber: you measure, they check. purple: mixed. green: users vote.</text>
</svg>
