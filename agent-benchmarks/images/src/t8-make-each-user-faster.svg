<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 498" width="1000" height="498" role="img" aria-label="Make each user faster">
<style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .n  { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .d  { font: 400 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .m  { font: 600 11px ui-monospace, Menlo, monospace; }
    .cap { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c2cd; }
    .rule { stroke: #2e3a47; stroke-width: 1; }
    .box { fill: #1b2531; stroke: #3d4956; stroke-width: 1.5; }
    .good { fill: #14301f; stroke: #5cc48a; stroke-width: 1.8; }
    .bad { fill: #2a1a1c; stroke: #e5646c; stroke-width: 1.8; }
    .blue { fill: #16314a; stroke: #5aa9e6; stroke-width: 1.8; }
    .amber { fill: #3a2c14; stroke: #f2a541; stroke-width: 1.8; }
    .purple { fill: #2a2140; stroke: #a98be8; stroke-width: 1.8; }
    .g { fill: #5cc48a; } .r { fill: #e5646c; } .b { fill: #5aa9e6; } .a { fill: #f2a541; } .w { fill: #dfe6ee; } .s { fill: #8a97a6; } .p { fill: #a98be8; }
    .arrow { stroke: #8a97a6; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .arrowb { stroke: #5aa9e6; stroke-width: 1.8; fill: none; marker-end: url(#ahb); }
    .arrowg { stroke: #5cc48a; stroke-width: 1.8; fill: none; marker-end: url(#ahg); }
    .arrowa { stroke: #f2a541; stroke-width: 1.8; fill: none; marker-end: url(#aha); }
    .arrowr { stroke: #e5646c; stroke-width: 1.8; fill: none; marker-end: url(#ahr); }
  .rowa{fill:#1b2531}.rowb{fill:#161d26;stroke:#2e3a47;stroke-width:1}.c{font:400 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#dfe6ee}.n{font-size:12px}</style>
<rect class="bg" width="1000" height="498" rx="6"/>
<text class="h" x="24" y="36">Make each user faster</text>
<rect class="box" x="24" y="58" width="952" height="33" rx="3"/><text class="n" x="36" y="80">Change</text><text class="n" x="292" y="80">What it does, in plain words</text><text class="n" x="553" y="80">Before and after (example)</text><text class="n" x="815" y="80">Risk</text><rect class="rowa" x="24" y="95" width="952" height="67" rx="3"/><text class="n" x="36" y="117">Quantization (FP8, FP4)</text><text class="c" x="292" y="117">Store each weight in fewer bytes.</text><text class="c" x="292" y="134">Less to read for each token, so the</text><text class="c" x="292" y="151">ceiling goes up.</text><text class="c" x="553" y="117">A 31B model in bf16 reads 62 GB for</text><text class="c" x="553" y="134">each token. In FP8 it reads 31 GB, so</text><text class="c" x="553" y="151">the ceiling doubles.</text><text class="c" x="815" y="117">Can lower quality.</text><text class="c" x="815" y="134">Always test (B.7).</text><rect class="rowb" x="24" y="166" width="952" height="84" rx="3"/><text class="n" x="36" y="188">Speculative decoding (MTP, EAGLE,</text><text class="n" x="36" y="205">a small draft model, n-gram)</text><text class="c" x="292" y="188">A small, fast helper guesses the next</text><text class="c" x="292" y="205">few tokens. The big model checks all</text><text class="c" x="292" y="222">the guesses in one read of its</text><text class="c" x="292" y="239">weights and keeps the correct ones.</text><text class="c" x="553" y="188">Before: one token for each read.</text><text class="c" x="553" y="205">After: often 2 or 3 tokens for each</text><text class="c" x="553" y="222">read, so 1.5x to 3x faster for one</text><text class="c" x="553" y="239">user.</text><text class="c" x="815" y="188">Gains drop when the</text><text class="c" x="815" y="205">guesses are often</text><text class="c" x="815" y="222">wrong.</text><rect class="rowa" x="24" y="254" width="952" height="84" rx="3"/><text class="n" x="36" y="276">Tensor parallel (-tp 2, -tp 4)</text><text class="c" x="292" y="276">Split each layer across several GPUs.</text><text class="c" x="292" y="293">Each GPU reads only its share of the</text><text class="c" x="292" y="310">weights, so they read faster</text><text class="c" x="292" y="327">together.</text><text class="c" x="553" y="276">2 GPUs: up to almost 2x the bandwidth</text><text class="c" x="553" y="293">for one user.</text><text class="c" x="815" y="276">Needs fast links</text><text class="c" x="815" y="293">between the GPUs.</text><rect class="rowb" x="24" y="342" width="952" height="84" rx="3"/><text class="n" x="36" y="364">CUDA graphs</text><text class="c" x="292" y="364">Record the GPU&#x27;s work for one step</text><text class="c" x="292" y="381">once, then replay it. The CPU no</text><text class="c" x="292" y="398">longer prepares each small piece</text><text class="c" x="292" y="415">every time.</text><text class="c" x="553" y="364">Removes small CPU delays in decode,</text><text class="c" x="553" y="381">which matter most for small models.</text><text class="c" x="815" y="364">Some kernels do not</text><text class="c" x="815" y="381">work with graphs.</text><rect class="rowa" x="24" y="430" width="952" height="50" rx="3"/><text class="n" x="36" y="452">Fewer users at the same time</text><text class="c" x="292" y="452">Let fewer requests share the GPU</text><text class="c" x="292" y="469">(--max-num-seqs).</text><text class="c" x="553" y="452">Each user is faster, but the server</text><text class="c" x="553" y="469">carries less in total (B.1).</text><text class="c" x="815" y="452">Higher cost for each</text><text class="c" x="815" y="469">token.</text>
</svg>
