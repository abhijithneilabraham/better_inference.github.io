<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" role="img" aria-label="Where the time of one agent task goes: TTFT, decode and tool work for each turn, before and after optimisation, with example numbers">
<style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .n  { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .d  { font: 400 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .m  { font: 600 11px ui-monospace, Menlo, monospace; }
    .cap { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c2cd; }
    .rule { stroke: #2e3a47; stroke-width: 1; }
    .box { fill: #1b2531; stroke: #3d4956; stroke-width: 1.5; }
    .good { fill: #14301f; stroke: #5cc48a; stroke-width: 1.8; }
    .bad { fill: #2a1a1c; stroke: #e5646c; stroke-width: 1.8; }
    .blue { fill: #16314a; stroke: #5aa9e6; stroke-width: 1.8; }
    .amber { fill: #3a2c14; stroke: #f2a541; stroke-width: 1.8; }
    .purple { fill: #2a2140; stroke: #a98be8; stroke-width: 1.8; }
    .g { fill: #5cc48a; } .r { fill: #e5646c; } .b { fill: #5aa9e6; } .a { fill: #f2a541; } .w { fill: #dfe6ee; } .s { fill: #8a97a6; } .p { fill: #a98be8; }
    .arrow { stroke: #8a97a6; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .arrowb { stroke: #5aa9e6; stroke-width: 1.8; fill: none; marker-end: url(#ahb); }
    .arrowg { stroke: #5cc48a; stroke-width: 1.8; fill: none; marker-end: url(#ahg); }
    .arrowa { stroke: #f2a541; stroke-width: 1.8; fill: none; marker-end: url(#aha); }
    .arrowr { stroke: #e5646c; stroke-width: 1.8; fill: none; marker-end: url(#ahr); }
  </style><defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a97a6"/></marker>
    <marker id="ahb" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5aa9e6"/></marker>
    <marker id="ahg" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5cc48a"/></marker>
    <marker id="aha" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f2a541"/></marker>
    <marker id="ahr" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e5646c"/></marker>
  </defs>
<rect class="bg" width="800" height="370" rx="6"/>
<text class="h" x="24" y="34">Where the time of one agent task goes</text>
<text class="t" x="776" y="34" text-anchor="end">AGENT TIME</text>
<text class="m s" x="24" y="66">one agent task: 30 turns, 400 output tokens per turn, 3 s of tool work per turn (example numbers)</text><text class="n" x="24" y="112">before</text><rect class="amber" x="150" y="90" width="72" height="34" rx="3"/><text class="m w" x="186" y="112" text-anchor="middle">TTFT 45 s</text><rect class="blue" x="222" y="90" width="320" height="34" rx="3"/><text class="m w" x="382" y="112" text-anchor="middle">decode 200 s</text><rect class="box" x="542" y="90" width="144" height="34" rx="3"/><text class="m w" x="614" y="112" text-anchor="middle">tools 90 s</text><text class="m w" x="696" y="112">335 s</text><text class="d" x="150" y="146">TTFT 1.5 s per turn, 60 tokens per second</text><text class="n" x="24" y="218">after</text><rect class="amber" x="150" y="196" width="19" height="34" rx="3"/><rect class="blue" x="169" y="196" width="128" height="34" rx="3"/><text class="m w" x="233" y="218" text-anchor="middle">decode 80 s</text><rect class="box" x="297" y="196" width="144" height="34" rx="3"/><text class="m w" x="369" y="218" text-anchor="middle">tools 90 s</text><text class="m g" x="451" y="218">182 s</text><text class="d" x="150" y="252">prefix cache: TTFT 0.4 s. speculative decoding + FP8: 150 tokens per second</text><line class="rule" x1="24" y1="276" x2="776" y2="276"/><text class="m w" x="24" y="304">task time = sum over turns of ( TTFT + output tokens / TPS ) + tool time</text><text class="cap" x="24" y="334">An agent does many turns. Each turn pays TTFT and decode again. Speed changes how many tasks finish</text><text class="cap" x="24" y="354">inside a benchmark time limit, and how long a developer waits.</text>
</svg>
