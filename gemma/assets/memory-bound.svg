<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Every decode step reads all the weights from memory; bandwidth divided by bytes gives the speed ceiling">
  <style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .lab { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; text-anchor: middle; }
    .sub { font: 400 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; text-anchor: middle; }
    .box { fill: #232d39; stroke: #2e3a47; stroke-width: 1.5; rx: 6; }
    .hbm { fill: #16314a; stroke: #5aa9e6; }
    .gpu { fill: #3a2c14; stroke: #f2a541; }
    .pipe { fill: none; stroke: #2e3a47; stroke-width: 14; stroke-linecap: round; }
    .flow { fill: none; stroke: #5aa9e6; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 18 14; animation: move 1.2s linear infinite; }
    @keyframes move { to { stroke-dashoffset: -32; } }
    .math { font: 600 14px ui-monospace, Menlo, monospace; fill: #dfe6ee; }
    .mathb { fill: #f2a541; }
    .note { font: 400 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .tok { fill: #f2a541; animation: pop 1.2s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { 0%,70% { transform: scale(0); } 80% { transform: scale(1.15); } 100% { transform: scale(1); } }
  </style>
  <rect class="bg" width="800" height="300" rx="6"/>
  <text class="h" x="24" y="34">Why decode is memory bound</text>
  <text class="t" x="776" y="34" text-anchor="end">ONE TOKEN, ONE FULL READ</text>

  <!-- HBM -->
  <rect class="box hbm" x="40" y="70" width="200" height="110"/>
  <text class="lab" x="140" y="102">HBM memory</text>
  <text class="sub" x="140" y="122">holds all the weights</text>
  <text class="sub" x="140" y="140">30.18 GB for this checkpoint</text>
  <text class="sub" x="140" y="164" style="fill:#5aa9e6;font-weight:600">6.85 TB/s</text>

  <!-- pipe -->
  <path class="pipe" d="M 250 125 H 470"/>
  <path class="flow" d="M 250 125 H 470"/>
  <text class="sub" x="360" y="108">every weight crosses this, every token</text>

  <!-- GPU -->
  <rect class="box gpu" x="480" y="70" width="200" height="110"/>
  <text class="lab" x="580" y="102">Tensor cores</text>
  <text class="sub" x="580" y="122">multiply, mostly waiting</text>
  <text class="sub" x="580" y="140">for the next weights to arrive</text>
  <rect class="tok" x="700" y="110" width="52" height="30" rx="3"/>
  <text class="sub" x="726" y="129" style="fill:#1a1207;font-weight:700">token</text>

  <!-- the arithmetic -->
  <text class="math" x="40" y="220">time per token  ≥  bytes ÷ bandwidth  =  30.18 GB ÷ 6.85 TB/s  =  <tspan class="mathb">4.4 ms</tspan></text>
  <text class="math" x="40" y="246">so without speculation the ceiling is about  1 ÷ 4.4 ms  ≈  <tspan class="mathb">225 tokens / s</tspan></text>
  <text class="note" x="40" y="272">This is the roofline. No software trick beats it. Only two things move it:</text>
  <text class="note" x="40" y="288">reading fewer bytes per token (quantisation), or getting more than one token per read (speculation).</text>
</svg>
