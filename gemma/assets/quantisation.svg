<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="BF16 stores each weight in 16 bits; NVFP4 stores 16 weights in 4 bits each plus one shared scale">
  <style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .lab { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .sub { font: 400 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .val { font: 700 13px ui-monospace, Menlo, monospace; fill: #dfe6ee; text-anchor: end; }
    .bit16 { fill: #f2a541; opacity: .8; }
    .bit4  { fill: #5aa9e6; }
    .scale { fill: #5cc48a; }
    .bl { font: 600 9px ui-monospace, Menlo, monospace; fill: #1a1207; text-anchor: middle; }
    .axis { stroke: #2e3a47; stroke-width: 1; }
    .lay { rx: 2; }
    .mlp { fill: #5aa9e6; } .attn { fill: #f2a541; }
    .key { font: 500 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c2cd; }
    .grow { transform-box: fill-box; transform-origin: left; animation: g 1s cubic-bezier(.2,.8,.2,1) both; }
    .grow.b { animation-delay: .3s; }
    @keyframes g { from { transform: scaleX(0); } }
  </style>
  <rect class="bg" width="800" height="360" rx="6"/>
  <text class="h" x="24" y="34">What 4-bit weights actually look like</text>
  <text class="t" x="776" y="34" text-anchor="end">16 WEIGHTS SHOWN</text>

  <!-- BF16 -->
  <text class="lab" x="24" y="72">BF16</text>
  <text class="sub" x="24" y="88">16 bits per weight</text>
  <g transform="translate(180,60)" class="grow">
    <rect class="bit16" x="0" y="0" width="30" height="34"/><rect class="bit16" x="32" y="0" width="30" height="34"/><rect class="bit16" x="64" y="0" width="30" height="34"/><rect class="bit16" x="96" y="0" width="30" height="34"/>
    <rect class="bit16" x="128" y="0" width="30" height="34"/><rect class="bit16" x="160" y="0" width="30" height="34"/><rect class="bit16" x="192" y="0" width="30" height="34"/><rect class="bit16" x="224" y="0" width="30" height="34"/>
    <rect class="bit16" x="256" y="0" width="30" height="34"/><rect class="bit16" x="288" y="0" width="30" height="34"/><rect class="bit16" x="320" y="0" width="30" height="34"/><rect class="bit16" x="352" y="0" width="30" height="34"/>
    <rect class="bit16" x="384" y="0" width="30" height="34"/><rect class="bit16" x="416" y="0" width="30" height="34"/><rect class="bit16" x="448" y="0" width="30" height="34"/><rect class="bit16" x="480" y="0" width="30" height="34"/>
  </g>
  <text class="val" x="776" y="82">32 bytes</text>

  <!-- NVFP4 -->
  <text class="lab" x="24" y="132">NVFP4</text>
  <text class="sub" x="24" y="148">4 bits per weight, plus one 8-bit</text>
  <text class="sub" x="24" y="162">scale shared by every 16 weights</text>
  <g transform="translate(180,120)" class="grow b">
    <rect class="bit4" x="0" y="0" width="30" height="9"/><rect class="bit4" x="32" y="0" width="30" height="9"/><rect class="bit4" x="64" y="0" width="30" height="9"/><rect class="bit4" x="96" y="0" width="30" height="9"/>
    <rect class="bit4" x="128" y="0" width="30" height="9"/><rect class="bit4" x="160" y="0" width="30" height="9"/><rect class="bit4" x="192" y="0" width="30" height="9"/><rect class="bit4" x="224" y="0" width="30" height="9"/>
    <rect class="bit4" x="256" y="0" width="30" height="9"/><rect class="bit4" x="288" y="0" width="30" height="9"/><rect class="bit4" x="320" y="0" width="30" height="9"/><rect class="bit4" x="352" y="0" width="30" height="9"/>
    <rect class="bit4" x="384" y="0" width="30" height="9"/><rect class="bit4" x="416" y="0" width="30" height="9"/><rect class="bit4" x="448" y="0" width="30" height="9"/><rect class="bit4" x="480" y="0" width="30" height="9"/>
    <rect class="scale" x="520" y="0" width="16" height="17"/><text class="bl" x="528" y="12">s</text>
  </g>
  <text class="val" x="776" y="132">9 bytes</text>
  <text class="sub" x="776" y="148" text-anchor="end">3.6× smaller, and the</text>
  <text class="sub" x="776" y="162" text-anchor="end">tensor cores read it directly</text>

  <line class="axis" x1="24" y1="190" x2="776" y2="190"/>

  <!-- the checkpoint reality -->
  <text class="lab" x="24" y="220">But this checkpoint only quantises some layers</text>
  <text class="sub" x="24" y="236">exclude_modules in the quant config lists every attention module and the output head</text>
  <g transform="translate(24,250)">
    <!-- one transformer block, drawn as its parts -->
    <rect class="lay attn" x="0" y="0" width="130" height="30"/><text class="bl" x="65" y="19" style="font-size:10px">attention · BF16</text>
    <rect class="lay mlp"  x="136" y="0" width="200" height="30"/><text class="bl" x="236" y="19" style="font-size:10px">MLP (gate · up · down) · NVFP4</text>
    <rect class="lay attn" x="342" y="0" width="130" height="30"/><text class="bl" x="407" y="19" style="font-size:10px">attention · BF16</text>
    <rect class="lay mlp"  x="478" y="0" width="200" height="30"/><text class="bl" x="578" y="19" style="font-size:10px">MLP · NVFP4</text>
    <text class="sub" x="686" y="19">× 60</text>
  </g>
  <text class="key" x="24" y="310">Attention: queries, keys, values and output projection all stay 16-bit. So does the output head.</text>
  <text class="key" x="24" y="328">MLP: the big feed-forward matrices, which are most of the parameters, go to 4-bit.</text>
  <text class="key" x="24" y="346" style="fill:#f2a541">Consequence: the unquantised attention weights are 16.96 GB, more than the 10.40 GB of 4-bit MLP. The next figure shows it.</text>
</svg>
