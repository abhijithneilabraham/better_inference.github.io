<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="EAGLE: a small separate draft model guesses future tokens, the main model verifies them">
  <style>
    .bg { fill: #161d26; }
    .h  { font: 700 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .box { rx: 6; stroke-width: 2; }
    .main { fill: #16314a; stroke: #5aa9e6; }
    .draft { fill: #3a2c14; stroke: #f2a541; }
    .bl { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .bs { font: 400 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; text-anchor: middle; }
    .tok { rx: 4; } .g { fill: #3a2c14; stroke: #f2a541; stroke-width: 1.5; stroke-dasharray: 4 3; } .ok { fill: #f2a541; }
    .tl { font: 700 11px ui-monospace, Menlo, monospace; text-anchor: middle; } .g + .tl { fill: #f2a541; } .ok + .tl { fill: #1a1207; }
    .arrow { stroke: #8a97a6; stroke-width: 2; fill: none; marker-end: url(#ah); }
    .step { font: 700 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cap { font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c2cd; }
    .d1 { animation: a .4s ease-out both .5s; } .d2 { animation: a .4s ease-out both .8s; } .d3 { animation: a .4s ease-out both 1.1s; }
    .v { animation: a .5s ease-out both 2s; }
    @keyframes a { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a97a6"/></marker></defs>
  <rect class="bg" width="800" height="300" rx="6"/>
  <text class="h" x="24" y="36">EAGLE</text>

  <!-- step 1: small draft model guesses -->
  <text class="step" x="24" y="76" style="fill:#f2a541">1. A small, separate draft model guesses the next few tokens</text>
  <rect class="box draft" x="24" y="88" width="150" height="56"/>
  <text class="bl" x="99" y="112" style="fill:#f2a541">Draft model</text>
  <text class="bs" x="99" y="130">small and fast</text>
  <path class="arrow" d="M 174 116 H 214"/>
  <g transform="translate(220,101)">
    <g class="d1"><rect class="tok g" x="0"   y="0" width="52" height="30"/><text class="tl" x="26"  y="20">the</text></g>
    <g class="d2"><rect class="tok g" x="60"  y="0" width="52" height="30"/><text class="tl" x="86"  y="20">cat</text></g>
    <g class="d3"><rect class="tok g" x="120" y="0" width="52" height="30"/><text class="tl" x="146" y="20">sat</text></g>
    <text class="bs" x="216" y="20" style="text-anchor:start">guesses, not yet trusted</text>
  </g>

  <!-- step 2: main model verifies -->
  <text class="step" x="24" y="190" style="fill:#5aa9e6">2. The main model checks all the guesses in one pass</text>
  <rect class="box main" x="24" y="202" width="150" height="56"/>
  <text class="bl" x="99" y="226" style="fill:#5aa9e6">Main model</text>
  <text class="bs" x="99" y="244">large and slow</text>
  <g class="v">
    <path class="arrow" d="M 174 230 H 214"/>
    <g transform="translate(220,215)">
      <rect class="tok ok" x="0"   y="0" width="52" height="30"/><text class="tl" x="26"  y="20">the</text>
      <rect class="tok ok" x="60"  y="0" width="52" height="30"/><text class="tl" x="86"  y="20">cat</text>
      <rect class="tok ok" x="120" y="0" width="52" height="30"/><text class="tl" x="146" y="20">sat</text>
      <text class="bs" x="216" y="20" style="text-anchor:start">confirmed and kept</text>
    </g>
  </g>

  <text class="cap" x="24" y="286">The main model only runs once to check three tokens, instead of three times to make them. That is the saving.</text>
</svg>
