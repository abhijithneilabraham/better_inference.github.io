<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="NextN: predict the next N tokens instead of one, then the main model verifies them">
  <style>
    .bg { fill: #161d26; }
    .h  { font: 700 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .box { rx: 6; stroke-width: 2; }
    .main { fill: #16314a; stroke: #5aa9e6; }
    .pred { fill: #3a2c14; stroke: #f2a541; }
    .bl { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .bs { font: 400 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; text-anchor: middle; }
    .tok { rx: 4; } .one { fill: #5aa9e6; } .g { fill: #3a2c14; stroke: #f2a541; stroke-width: 1.5; stroke-dasharray: 4 3; } .ok { fill: #f2a541; }
    .tl { font: 700 11px ui-monospace, Menlo, monospace; text-anchor: middle; } .one + .tl { fill: #1a1207; } .g + .tl { fill: #f2a541; } .ok + .tl { fill: #1a1207; }
    .arrow { stroke: #8a97a6; stroke-width: 2; fill: none; marker-end: url(#ah); }
    .step { font: 700 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cap { font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c2cd; }
    .f1 { animation: a .3s ease-out both .4s; } .f2 { animation: a .3s ease-out both .6s; } .f3 { animation: a .3s ease-out both .8s; } .f4 { animation: a .3s ease-out both 1.0s; }
    .v { animation: a .5s ease-out both 1.8s; }
    @keyframes a { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a97a6"/></marker></defs>
  <rect class="bg" width="800" height="300" rx="6"/>
  <text class="h" x="24" y="36">NextN</text>

  <!-- usual: next one -->
  <text class="step" x="24" y="72" style="fill:#8a97a6">The usual way: predict the next 1 token</text>
  <rect class="box main" x="24" y="82" width="130" height="40" style="opacity:.6"/>
  <text class="bl" x="89" y="107" style="fill:#5aa9e6">one step</text>
  <path class="arrow" d="M 154 102 H 192"/>
  <rect class="tok one" x="198" y="87" width="52" height="30"/><text class="tl" x="224" y="107">t+1</text>

  <!-- NextN: next N -->
  <text class="step" x="24" y="158" style="fill:#f2a541">NextN: predict the next N tokens in the same step (N = 4 here)</text>
  <rect class="box pred" x="24" y="168" width="130" height="40"/>
  <text class="bl" x="89" y="193" style="fill:#f2a541">one step</text>
  <path class="arrow" d="M 154 188 H 192"/>
  <g transform="translate(198,173)">
    <g class="f1"><rect class="tok g" x="0"   y="0" width="52" height="30"/><text class="tl" x="26"  y="20">t+1</text></g>
    <g class="f2"><rect class="tok g" x="60"  y="0" width="52" height="30"/><text class="tl" x="86"  y="20">t+2</text></g>
    <g class="f3"><rect class="tok g" x="120" y="0" width="52" height="30"/><text class="tl" x="146" y="20">t+3</text></g>
    <g class="f4"><rect class="tok g" x="180" y="0" width="52" height="30"/><text class="tl" x="206" y="20">t+4</text></g>
  </g>
  <g class="v">
    <path class="arrow" d="M 436 188 H 474"/>
    <rect class="box main" x="480" y="168" width="150" height="40"/>
    <text class="bl" x="555" y="193" style="fill:#5aa9e6">main model checks</text>
    <path class="arrow" d="M 630 188 H 668"/>
    <rect class="tok ok" x="674" y="173" width="100" height="30"/><text class="tl" x="724" y="193">kept if right</text>
  </g>

  <text class="cap" x="24" y="250">The N predictions are used as draft tokens. The main model verifies them in one pass and keeps the ones that match.</text>
  <text class="cap" x="24" y="270">More tokens per step means fewer expensive steps overall.</text>
</svg>
