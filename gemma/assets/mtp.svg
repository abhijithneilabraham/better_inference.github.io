<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="MTP: prediction modules attached to the main model, trained with it, each predicting one token further; no separate draft model">
  <style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .sub { font: 400 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .big { fill: #16314a; stroke: #5aa9e6; stroke-width: 1.5; rx: 5; }
    .bigl { font: 700 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5aa9e6; text-anchor: middle; }
    .bigs { font: 400 9.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; text-anchor: middle; }
    .head { fill: #16314a; stroke: #5aa9e6; stroke-width: 1; rx: 3; }
    .mod { fill: #3a2c14; stroke: #f2a541; stroke-width: 1.5; rx: 4; }
    .modl { font: 700 10px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f2a541; text-anchor: middle; }
    .feat { fill: #5cc48a; opacity: .85; rx: 2; }
    .featl { font: 600 8.5px ui-monospace, Menlo, monospace; fill: #1a1207; text-anchor: middle; }
    .tok { rx: 3; } .out { fill: #f2a541; } .out + .tokl { fill: #1a1207; }
    .tokl { font: 600 10px ui-monospace, Menlo, monospace; text-anchor: middle; }
    .arrow { stroke: #8a97a6; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
    .share { stroke: #5cc48a; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .key { font: 500 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c2cd; }
    .num { font: 700 11.5px ui-monospace, Menlo, monospace; fill: #dfe6ee; }
    .kv { fill: #17311f; stroke: #5cc48a; stroke-width: 1; rx: 3; }
    .kvl { font: 600 9.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5cc48a; text-anchor: middle; }
    .m1 { animation: a .5s ease-out both .5s; } .m2 { animation: a .5s ease-out both 1.1s; } .m3 { animation: a .5s ease-out both 1.7s; }
    @keyframes a { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a97a6"/></marker></defs>
  <rect class="bg" width="800" height="380" rx="6"/>
  <text class="h" x="24" y="34">MTP: prediction modules built into the model</text>
  <text class="t" x="776" y="34" text-anchor="end">TRAINED TOGETHER · NO SEPARATE DRAFT MODEL</text>

  <!-- trunk -->
  <rect class="big" x="24" y="70" width="150" height="120"/>
  <text class="bigl" x="99" y="98">Main model trunk</text>
  <text class="bigs" x="99" y="114">all 60 layers</text>
  <text class="bigs" x="99" y="140">one pass produces the</text>
  <text class="bigs" x="99" y="154">final hidden state h</text>
  <!-- standard head -->
  <rect class="head" x="24" y="200" width="150" height="26"/>
  <text class="bigl" x="99" y="217" style="font-size:10px">standard head → token t+1</text>
  <path class="arrow" d="M 99 190 V 198"/>
  <g transform="translate(24,236)"><rect class="tok out" x="55" y="0" width="40" height="26"/><text class="tokl" x="75" y="17">t+1</text></g>

  <!-- h out to the right -->
  <path class="arrow" d="M 174 130 H 206"/>
  <rect class="feat" x="210" y="116" width="34" height="28"/><text class="featl" x="227" y="133">h</text>

  <!-- MTP module 1 -->
  <g class="m1">
    <path class="arrow" d="M 244 130 H 272"/>
    <rect class="mod" x="276" y="96" width="112" height="68"/>
    <text class="modl" x="332" y="116">MTP module 1</text>
    <text class="bigs" x="332" y="131">a few small layers</text>
    <text class="bigs" x="332" y="145">in: h + embed(t+1)</text>
    <text class="bigs" x="332" y="158" style="fill:#f2a541">out: token t+2, h′</text>
    <rect class="tok out" x="312" y="176" width="40" height="26"/><text class="tokl" x="332" y="193">t+2</text>
  </g>
  <!-- MTP module 2 -->
  <g class="m2">
    <path class="arrow" d="M 388 130 H 416"/>
    <rect class="mod" x="420" y="96" width="112" height="68"/>
    <text class="modl" x="476" y="116">MTP module 2</text>
    <text class="bigs" x="476" y="131">same shape</text>
    <text class="bigs" x="476" y="145">in: h′ + embed(t+2)</text>
    <text class="bigs" x="476" y="158" style="fill:#f2a541">out: token t+3, h″</text>
    <rect class="tok out" x="456" y="176" width="40" height="26"/><text class="tokl" x="476" y="193">t+3</text>
  </g>
  <g class="m3">
    <path class="arrow" d="M 532 130 H 560"/>
    <text class="sub" x="566" y="134">… chained, one</text>
    <text class="sub" x="566" y="148">token further each</text>
  </g>

  <!-- shared KV -->
  <rect class="kv" x="24" y="286" width="508" height="26"/>
  <text class="kvl" x="278" y="303">one KV cache, shared by the trunk and every MTP module</text>
  <path class="share" d="M 99 232 V 286"/><path class="share" d="M 332 202 V 286"/><path class="share" d="M 476 202 V 286"/>

  <text class="key" x="24" y="336">The modules are trained alongside the trunk, so their guesses match what the trunk would say far more often than a generic head does.</text>
  <text class="key" x="24" y="352">Gemma 4 ships its modules as a 4-layer "assistant" that predicts one token ahead per step, looped k times, sharing the trunk's KV cache.</text>
  <text class="num" x="24" y="372">Measured (vLLM 0.24, BF16): MTP, k=6 → <tspan style="fill:#f2a541">139.4 tok/s, acceptance 3.79</tspan>. Twice EAGLE's speed, from a drafter that knows the model.</text>
</svg>
