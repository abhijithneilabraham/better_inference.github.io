<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="MTP: the main model has extra prediction heads that predict several future tokens in one step; no separate draft model">
  <style>
    .bg { fill: #161d26; }
    .h  { font: 700 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .box { rx: 6; stroke-width: 2; }
    .main { fill: #16314a; stroke: #5aa9e6; }
    .head { fill: #3a2c14; stroke: #f2a541; }
    .bl { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .bs { font: 400 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; text-anchor: middle; }
    .hl { font: 700 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f2a541; text-anchor: middle; }
    .tok { rx: 4; fill: #f2a541; } .tl { font: 700 11px ui-monospace, Menlo, monospace; fill: #1a1207; text-anchor: middle; }
    .arrow { stroke: #8a97a6; stroke-width: 2; fill: none; marker-end: url(#ah); }
    .cap { font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c2cd; }
    .h1 { animation: a .4s ease-out both .4s; } .h2 { animation: a .4s ease-out both .8s; } .h3 { animation: a .4s ease-out both 1.2s; }
    @keyframes a { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a97a6"/></marker></defs>
  <rect class="bg" width="800" height="300" rx="6"/>
  <text class="h" x="24" y="36">MTP (Multi-Token Prediction)</text>

  <!-- one main model -->
  <rect class="box main" x="24" y="80" width="190" height="130"/>
  <text class="bl" x="119" y="118" style="fill:#5aa9e6">Main model</text>
  <text class="bs" x="119" y="138">one forward pass</text>
  <text class="bs" x="119" y="170">its usual output:</text>
  <rect class="tok" x="93" y="178" width="52" height="26"/><text class="tl" x="119" y="196">t+1</text>

  <!-- extra heads attached to it -->
  <path class="arrow" d="M 214 110 H 258"/>
  <g class="h1">
    <rect class="box head" x="264" y="86" width="150" height="48"/>
    <text class="hl" x="339" y="106">extra head 1</text>
    <text class="bs" x="339" y="124">predicts one further</text>
    <path class="arrow" d="M 414 110 H 452"/>
    <rect class="tok" x="458" y="97" width="52" height="26"/><text class="tl" x="484" y="115">t+2</text>
  </g>
  <path class="arrow" d="M 214 145 H 258"/>
  <g class="h2">
    <rect class="box head" x="264" y="146" width="150" height="48"/>
    <text class="hl" x="339" y="166">extra head 2</text>
    <text class="bs" x="339" y="184">predicts two further</text>
    <path class="arrow" d="M 414 170 H 452"/>
    <rect class="tok" x="458" y="157" width="52" height="26"/><text class="tl" x="484" y="175">t+3</text>
  </g>
  <g class="h3">
    <text class="bs" x="339" y="222">… and so on</text>
  </g>

  <!-- bracket showing they're all one model -->
  <path d="M 24 226 v 8 h 490 v -8" stroke="#8a97a6" stroke-width="1" fill="none"/>
  <text class="bs" x="269" y="250">all of this is one model. The extra heads are small parts of it, trained together with it.</text>

  <text class="cap" x="24" y="286">Several tokens come out of one step. No separate draft model is needed, so nothing extra has to be loaded into memory.</text>
</svg>
