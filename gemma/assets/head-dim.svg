<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="Attention splits the hidden vector into heads; sliding layers use 256-wide heads, global layers use 512-wide heads that most kernels cannot handle">
  <style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .lab { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .sub { font: 400 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .hid { fill: #232d39; stroke: #2e3a47; stroke-width: 1; }
    .hd256 { fill: #5aa9e6; opacity: .7; }
    .hd512 { fill: #f2a541; }
    .hl { font: 600 9px ui-monospace, Menlo, monospace; fill: #1a1207; text-anchor: middle; }
    .cap { font: 600 10.5px ui-monospace, Menlo, monospace; fill: #8a97a6; }
    .lim { stroke: #e5646c; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .liml { font: 600 10.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e5646c; }
    .hd512 { animation: stretch 1s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: left; }
    @keyframes stretch { from { transform: scaleX(.5); } }
  </style>
  <rect class="bg" width="800" height="330" rx="6"/>
  <text class="h" x="24" y="34">What "head size 512" means</text>
  <text class="t" x="776" y="34" text-anchor="end">HIDDEN SIZE 5376</text>

  <text class="sub" x="24" y="60">Attention does not look at the whole 5376-wide hidden vector at once. It splits it into heads, and each head attends on its own.</text>
  <text class="sub" x="24" y="76">The width of each head is the head size. Kernels are written and tuned for specific widths.</text>

  <!-- sliding -->
  <text class="lab" x="24" y="102">Sliding layers (50 of them)</text>
  <text class="sub" x="24" y="118">32 query heads × 256 wide · 16 KV heads · window of 1,024 tokens</text>
  <g transform="translate(24,126)">
    <rect class="hd256" x="0"   y="0" width="60" height="26"/><text class="hl" x="30"  y="17">256</text>
    <rect class="hd256" x="64"  y="0" width="60" height="26"/><text class="hl" x="94"  y="17">256</text>
    <rect class="hd256" x="128" y="0" width="60" height="26"/><text class="hl" x="158" y="17">256</text>
    <rect class="hd256" x="192" y="0" width="60" height="26"/><text class="hl" x="222" y="17">256</text>
    <rect class="hd256" x="256" y="0" width="60" height="26"/><text class="hl" x="286" y="17">256</text>
    <rect class="hd256" x="320" y="0" width="60" height="26"/><text class="hl" x="350" y="17">256</text>
    <text class="sub" x="388" y="17">… × 32</text>
    <text class="cap" x="520" y="17">every kernel handles this</text>
  </g>

  <!-- global -->
  <text class="lab" x="24" y="186">Global layers (10 of them)</text>
  <text class="sub" x="24" y="202">32 query heads × 512 wide · only 4 KV heads · full context</text>
  <g transform="translate(24,210)">
    <rect class="hd512" x="0"   y="0" width="124" height="26"/><text class="hl" x="62"  y="17">512</text>
    <rect class="hd512" x="128" y="0" width="124" height="26"/><text class="hl" x="190" y="17">512</text>
    <rect class="hd512" x="256" y="0" width="124" height="26"/><text class="hl" x="318" y="17">512</text>
    <text class="sub" x="388" y="17">… × 32</text>
    <text class="cap" x="520" y="17" style="fill:#f2a541">twice as wide</text>
  </g>

  <!-- the kernel limit line -->
  <line class="lim" x1="24" y1="252" x2="776" y2="252"/>
  <text class="liml" x="24" y="268">Most attention kernels are tuned and tested up to 256. trtllm-gen, the one vLLM picks on Blackwell, has no 512 kernel at all.</text>

  <text class="sub" x="24" y="296">And 512 is not a setting. It is the shape those ten layers' weights were trained with. Read them as 256 and every number is wrong.</text>
  <text class="sub" x="24" y="314">So the whole problem reduces to: find a kernel that genuinely computes attention at width 512, and get the engine to use it for exactly these ten layers.</text>
</svg>
