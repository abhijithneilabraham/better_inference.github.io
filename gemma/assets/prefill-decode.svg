<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Prefill reads the whole prompt at once; decode produces one token at a time">
  <style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .lab { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .sub { font: 400 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .amb { fill: #f2a541; } .blu { fill: #5aa9e6; }
    .tok { font: 600 10px ui-monospace, Menlo, monospace; fill: #1a1207; text-anchor: middle; }
    .in  { fill: #5aa9e6; opacity: .55; }
    .axis { stroke: #2e3a47; stroke-width: 1; }
    .brace { stroke: #8a97a6; stroke-width: 1; fill: none; }
    .out { fill: #f2a541; animation: pop .4s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: center; }
    .out.t1 { animation-delay: 1.2s; } .out.t2 { animation-delay: 1.7s; } .out.t3 { animation-delay: 2.2s; }
    .out.t4 { animation-delay: 2.7s; } .out.t5 { animation-delay: 3.2s; } .out.t6 { animation-delay: 3.7s; }
    .out.t7 { animation-delay: 4.2s; } .out.t8 { animation-delay: 4.7s; }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    .pf { fill: #5aa9e6; opacity: .25; animation: fillin 1.1s ease-out both; transform-box: fill-box; transform-origin: left; }
    @keyframes fillin { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .arrow { stroke: #8a97a6; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  </style>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a97a6"/></marker></defs>
  <rect class="bg" width="800" height="300" rx="6"/>
  <text class="h" x="24" y="34">Two phases of every request</text>
  <text class="t" x="776" y="34" text-anchor="end">10K IN · 1.5K OUT</text>

  <!-- prompt tokens stack -->
  <text class="lab" x="24" y="76">The prompt</text>
  <text class="sub" x="24" y="92">10,000 tokens</text>
  <g transform="translate(24,102)">
    <rect class="in" x="0" y="0" width="9" height="9" rx="1"/><rect class="in" x="11" y="0" width="9" height="9" rx="1"/><rect class="in" x="22" y="0" width="9" height="9" rx="1"/><rect class="in" x="33" y="0" width="9" height="9" rx="1"/><rect class="in" x="44" y="0" width="9" height="9" rx="1"/><rect class="in" x="55" y="0" width="9" height="9" rx="1"/><rect class="in" x="66" y="0" width="9" height="9" rx="1"/><rect class="in" x="77" y="0" width="9" height="9" rx="1"/>
    <rect class="in" x="0" y="11" width="9" height="9" rx="1"/><rect class="in" x="11" y="11" width="9" height="9" rx="1"/><rect class="in" x="22" y="11" width="9" height="9" rx="1"/><rect class="in" x="33" y="11" width="9" height="9" rx="1"/><rect class="in" x="44" y="11" width="9" height="9" rx="1"/><rect class="in" x="55" y="11" width="9" height="9" rx="1"/><rect class="in" x="66" y="11" width="9" height="9" rx="1"/><rect class="in" x="77" y="11" width="9" height="9" rx="1"/>
    <rect class="in" x="0" y="22" width="9" height="9" rx="1"/><rect class="in" x="11" y="22" width="9" height="9" rx="1"/><rect class="in" x="22" y="22" width="9" height="9" rx="1"/><rect class="in" x="33" y="22" width="9" height="9" rx="1"/><rect class="in" x="44" y="22" width="9" height="9" rx="1"/><rect class="in" x="55" y="22" width="9" height="9" rx="1"/><rect class="in" x="66" y="22" width="9" height="9" rx="1"/><rect class="in" x="77" y="22" width="9" height="9" rx="1"/>
    <rect class="in" x="0" y="33" width="9" height="9" rx="1"/><rect class="in" x="11" y="33" width="9" height="9" rx="1"/><rect class="in" x="22" y="33" width="9" height="9" rx="1"/><rect class="in" x="33" y="33" width="9" height="9" rx="1"/><text class="sub" x="48" y="42">…</text>
  </g>
  <path class="arrow" d="M 125 125 H 165"/>

  <!-- timeline -->
  <line class="axis" x1="180" y1="180" x2="776" y2="180"/>
  <text class="sub" x="776" y="196" text-anchor="end">time →</text>

  <!-- prefill block -->
  <rect class="pf" x="180" y="110" width="150" height="70" rx="3"/>
  <rect x="180" y="110" width="150" height="70" rx="3" fill="none" stroke="#5aa9e6" stroke-width="1.5"/>
  <text class="lab" x="255" y="140" text-anchor="middle" style="fill:#5aa9e6">PREFILL</text>
  <text class="sub" x="255" y="158" text-anchor="middle">all 10k tokens in one pass</text>
  <text class="sub" x="255" y="172" text-anchor="middle">compute bound</text>

  <!-- decode tokens -->
  <g transform="translate(346,138)">
    <rect class="out t1" x="0"   y="0" width="40" height="40" rx="3"/><text class="tok" x="20"  y="25">Mach</text>
    <rect class="out t2" x="50"  y="0" width="40" height="40" rx="3"/><text class="tok" x="70"  y="25">ine</text>
    <rect class="out t3" x="100" y="0" width="40" height="40" rx="3"/><text class="tok" x="120" y="25">learn</text>
    <rect class="out t4" x="150" y="0" width="40" height="40" rx="3"/><text class="tok" x="170" y="25">ing</text>
    <rect class="out t5" x="200" y="0" width="40" height="40" rx="3"/><text class="tok" x="220" y="25">is</text>
    <rect class="out t6" x="250" y="0" width="40" height="40" rx="3"/><text class="tok" x="270" y="25">a</text>
    <rect class="out t7" x="300" y="0" width="40" height="40" rx="3"/><text class="tok" x="320" y="25">sub</text>
    <rect class="out t8" x="350" y="0" width="40" height="40" rx="3"/><text class="tok" x="370" y="25">set</text>
    <text class="sub" x="400" y="26">… ×1,500</text>
  </g>
  <text class="lab" x="346" y="128" style="fill:#f2a541">DECODE</text>
  <text class="sub" x="410" y="128">one token per forward pass, over and over · memory bound</text>

  <!-- TTFT brace -->
  <path class="brace" d="M 180 208 v 8 h 150 v -8"/>
  <text class="sub" x="255" y="232" text-anchor="middle">time to first token (TTFT)</text>
  <!-- tok/s brace -->
  <path class="brace" d="M 346 208 v 8 h 390 v -8"/>
  <text class="sub" x="541" y="232" text-anchor="middle">this is where tokens per second is measured</text>

  <text class="sub" x="24" y="272">A long answer spends almost all of its time in decode. That is why this article is only about decode.</text>
</svg>
