<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" width="800" height="210" role="img" aria-label="Roofline 4.6 ms versus measured 29.7 ms per decode step, 6.5x gap">
  <style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .lab { font: 500 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .sub { font: 400 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .val { font: 700 15px ui-monospace, Menlo, monospace; fill: #dfe6ee; text-anchor: end; }
    .track { fill: #232d39; }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.3s cubic-bezier(.2,.8,.2,1) both; }
    .ideal { fill: #5aa9e6; }
    .over  { fill: #f2a541; animation-delay: .5s; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .gap { font: 800 24px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f2a541; }
    .gapd { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .brace { stroke: #f2a541; stroke-width: 1; fill: none; opacity: 0; animation: show 1.3s .9s both; }
    @keyframes show { to { opacity: 1; } }
  </style>
  <rect class="bg" width="800" height="210" rx="6"/>
  <text class="h" x="24" y="34">Roofline vs measured, per decode step</text>
  <text class="t" x="776" y="34" text-anchor="end">K = 8 · 150.0 TOK/S</text>

  <text class="lab" x="24" y="72">Memory roofline</text>
  <text class="sub" x="24" y="88">31.4 GB at 6.85 TB/s</text>
  <rect class="track" x="200" y="60" width="500" height="26" rx="3"/>
  <rect class="bar ideal" x="200" y="60" width="77" height="26" rx="3"/>
  <text class="val" x="776" y="78">4.6 ms</text>

  <text class="lab" x="24" y="120">Measured step</text>
  <text class="sub" x="24" y="136">accept ~4.45</text>
  <rect class="track" x="200" y="108" width="500" height="26" rx="3"/>
  <rect class="bar ideal" x="200" y="108" width="77" height="26" rx="3"/>
  <rect class="bar over"  x="277" y="108" width="423" height="26" rx="3"/>
  <text class="val" x="776" y="126">29.7 ms</text>

  <path class="brace" d="M 280 142 v 6 h 417 v -6"/>
  <text class="gap" x="200" y="180">6.5× off the roofline</text>
  <text class="gapd" x="200" y="198">≈85% of each step is launch overhead, dispatch and the drafter — not reading weights.</text>
</svg>
