<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 432" width="800" height="432" role="img" aria-label="What happens to the KV cache pool, the offload host pool and the disk tier when vllm-metal sleeps and wakes">
<style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .n  { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .d  { font: 400 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .m  { font: 600 11px ui-monospace, Menlo, monospace; }
    .cap { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c2cd; }
    .rule { stroke: #2e3a47; stroke-width: 1; }
    .box { fill: #1b2531; stroke: #3d4956; stroke-width: 1.5; }
    .good { fill: #14301f; stroke: #5cc48a; stroke-width: 1.8; }
    .bad { fill: #2a1a1c; stroke: #e5646c; stroke-width: 1.8; }
    .blue { fill: #16314a; stroke: #5aa9e6; stroke-width: 1.8; }
    .amber { fill: #3a2c14; stroke: #f2a541; stroke-width: 1.8; }
    .purple { fill: #2a2140; stroke: #a98be8; stroke-width: 1.8; }
    .g { fill: #5cc48a; } .r { fill: #e5646c; } .b { fill: #5aa9e6; } .a { fill: #f2a541; } .w { fill: #dfe6ee; } .s { fill: #8a97a6; } .p { fill: #a98be8; }
    .arrow { stroke: #8a97a6; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .arrowb { stroke: #5aa9e6; stroke-width: 1.8; fill: none; marker-end: url(#ahb); }
    .arrowg { stroke: #5cc48a; stroke-width: 1.8; fill: none; marker-end: url(#ahg); }
    .arrowa { stroke: #f2a541; stroke-width: 1.8; fill: none; marker-end: url(#aha); }
    .arrowr { stroke: #e5646c; stroke-width: 1.8; fill: none; marker-end: url(#ahr); }
  </style><defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a97a6"/></marker>
    <marker id="ahb" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5aa9e6"/></marker>
    <marker id="ahg" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5cc48a"/></marker>
    <marker id="aha" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f2a541"/></marker>
    <marker id="ahr" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e5646c"/></marker>
  </defs>
<rect class="bg" width="800" height="432" rx="6"/>
<text class="h" x="24" y="34">Sleep with KV offloading on</text>
<text class="t" x="776" y="34" text-anchor="end">OFFLOAD</text>
<text class="t" x="24" y="68">UNIFIED MEMORY</text><text class="t" x="600" y="68">ON DISK</text><line class="rule" x1="584" y1="56" x2="584" y2="352" style="stroke-dasharray:4 4"/><text class="n" x="24" y="94">Awake, serving</text><rect class="blue" x="24" y="104" width="150" height="44" rx="4"/><text class="n" x="34" y="123" style="font-size:12px">model weights</text><text class="d" x="34" y="139">in place</text><rect class="amber" x="174" y="104" width="190" height="44" rx="4"/><text class="n" x="184" y="123" style="font-size:12px">KV cache pool</text><text class="d" x="184" y="139">in use</text><rect class="purple" x="364" y="104" width="200" height="44" rx="4"/><text class="n" x="374" y="123" style="font-size:12px">host pool</text><text class="d" x="374" y="139">holds offloaded blocks</text><rect class="box" x="600" y="104" width="176" height="44" rx="4"/><text class="n" x="610" y="123" style="font-size:12px">disk tier (optional)</text><text class="d" x="610" y="139">holds offloaded blocks</text><text class="n" x="24" y="184">After sleep(level=1)</text><rect class="blue" x="24" y="194" width="150" height="44" rx="4"/><text class="n" x="34" y="213" style="font-size:12px">model weights</text><text class="d" x="34" y="229">stay in place</text><rect class="good" x="174" y="194" width="190" height="44" rx="4"/><text class="n" x="184" y="213" style="font-size:12px">given back to macOS</text><text class="d" x="184" y="229">KV cache pool freed</text><rect class="purple" x="364" y="194" width="200" height="44" rx="4" style="stroke-dasharray:5 4"/><text class="n" x="374" y="213" style="font-size:12px">host pool, emptied</text><text class="d" x="374" y="229">its memory is still held</text><rect class="box" x="600" y="194" width="176" height="44" rx="4"/><text class="n" x="610" y="213" style="font-size:12px">disk tier</text><text class="d" x="610" y="229">keeps its blocks</text><text class="n" x="24" y="274">After wake_up()</text><rect class="blue" x="24" y="284" width="150" height="44" rx="4"/><text class="n" x="34" y="303" style="font-size:12px">model weights</text><text class="d" x="34" y="319">never moved</text><rect class="amber" x="174" y="284" width="190" height="44" rx="4"/><text class="n" x="184" y="303" style="font-size:12px">new, empty KV pool</text><text class="d" x="184" y="319">same layout as before</text><rect class="purple" x="364" y="284" width="200" height="44" rx="4"/><text class="n" x="374" y="303" style="font-size:12px">host pool</text><text class="d" x="374" y="319">fills again</text><rect class="box" x="600" y="284" width="176" height="44" rx="4"/><text class="n" x="610" y="303" style="font-size:12px">disk tier</text><text class="d" x="610" y="319">old prompts restore</text><line class="rule" x1="24" y1="352" x2="776" y2="352"/><text class="cap" x="24" y="376">Moving the KV cache into the host pool at sleep would free nothing: both are in the same memory.</text><text class="cap" x="24" y="396">Sleep empties the host pool but keeps its memory. A prompt stored before sleep still restores after</text><text class="cap" x="24" y="416">wake: 2,320 tokens in the test, from a 2 GiB host pool with the disk tier.</text>
</svg>
