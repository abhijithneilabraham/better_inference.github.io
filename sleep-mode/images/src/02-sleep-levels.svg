<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" width="800" height="366" role="img" aria-label="What sleep level 1 and level 2 do on a GPU server and on a Mac with vllm-metal">
<style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .n  { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .d  { font: 400 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .m  { font: 600 11px ui-monospace, Menlo, monospace; }
    .cap { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c2cd; }
    .rule { stroke: #2e3a47; stroke-width: 1; }
    .box { fill: #1b2531; stroke: #3d4956; stroke-width: 1.5; }
    .good { fill: #14301f; stroke: #5cc48a; stroke-width: 1.8; }
    .bad { fill: #2a1a1c; stroke: #e5646c; stroke-width: 1.8; }
    .blue { fill: #16314a; stroke: #5aa9e6; stroke-width: 1.8; }
    .amber { fill: #3a2c14; stroke: #f2a541; stroke-width: 1.8; }
    .purple { fill: #2a2140; stroke: #a98be8; stroke-width: 1.8; }
    .g { fill: #5cc48a; } .r { fill: #e5646c; } .b { fill: #5aa9e6; } .a { fill: #f2a541; } .w { fill: #dfe6ee; } .s { fill: #8a97a6; } .p { fill: #a98be8; }
    .arrow { stroke: #8a97a6; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .arrowb { stroke: #5aa9e6; stroke-width: 1.8; fill: none; marker-end: url(#ahb); }
    .arrowg { stroke: #5cc48a; stroke-width: 1.8; fill: none; marker-end: url(#ahg); }
    .arrowa { stroke: #f2a541; stroke-width: 1.8; fill: none; marker-end: url(#aha); }
    .arrowr { stroke: #e5646c; stroke-width: 1.8; fill: none; marker-end: url(#ahr); }
  </style><defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a97a6"/></marker>
    <marker id="ahb" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5aa9e6"/></marker>
    <marker id="ahg" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5cc48a"/></marker>
    <marker id="aha" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f2a541"/></marker>
    <marker id="ahr" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e5646c"/></marker>
  </defs>
<rect class="bg" width="800" height="366" rx="6"/>
<text class="h" x="24" y="34">What the sleep levels mean</text>
<text class="t" x="776" y="34" text-anchor="end">LEVELS</text>
<text class="n" x="24" y="68">vLLM on a GPU server</text><text class="n" x="416" y="68">vllm-metal on a Mac</text><rect class="blue" x="24" y="80" width="360" height="96" rx="6"/><text class="n" x="38" y="104">level 1</text><text class="d" x="38" y="126" style="font-size:12px">weights: copied from the GPU to CPU memory</text><text class="d" x="38" y="143" style="font-size:12px">KV cache: thrown away</text><text class="d" x="38" y="160" style="font-size:12px">wake_up copies the weights back (seconds)</text><rect class="purple" x="24" y="190" width="360" height="96" rx="6"/><text class="n" x="38" y="214">level 2</text><text class="d" x="38" y="236" style="font-size:12px">weights: thrown away</text><text class="d" x="38" y="253" style="font-size:12px">KV cache: thrown away</text><text class="d" x="38" y="270" style="font-size:12px">wake_up loads the weights from disk again</text><rect class="good" x="416" y="80" width="360" height="96" rx="6"/><text class="n" x="430" y="104">level 1</text><text class="d" x="430" y="126" style="font-size:12px">weights: stay where they are</text><text class="d" x="430" y="143" style="font-size:12px">KV cache: thrown away, memory goes back to macOS</text><text class="d" x="430" y="160" style="font-size:12px">wake_up makes a new empty KV cache (well under 1 s)</text><rect class="box" x="416" y="190" width="360" height="96" rx="6"/><text class="n" x="430" y="214">level 2</text><text class="d" x="430" y="236" style="font-size:12px">not supported yet</text><text class="d" x="430" y="253" style="font-size:12px">needs a way to load the weights again</text><text class="d" x="430" y="270" style="font-size:12px">the call fails with a clear error</text><line class="rule" x1="24" y1="306" x2="776" y2="306"/><text class="cap" x="24" y="330">On a GPU, "CPU memory" is a second, cheaper place, so moving the weights there frees GPU memory. On a Mac the</text><text class="cap" x="24" y="350">CPU and the GPU share one memory, so the copy would free nothing. That is why level 1 means less on a Mac.</text>
</svg>
