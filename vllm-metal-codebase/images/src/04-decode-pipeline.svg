  </defs><rect width="100%" height="100%" fill="#ffffff"/><text class="h k-hw" x="20" y="30" text-anchor="start">Without the pipeline: the GPU waits while Python samples and builds the next batch</text><text class="n" x="20" y="64" text-anchor="start">CPU</text><text class="n" x="20" y="100" text-anchor="start">GPU</text><rect class="b-runner" x="90" y="44" width="80" height="28" rx="4"/><text class="d" x="98" y="62" text-anchor="start">build 1</text><rect class="b-kern" x="170" y="80" width="120" height="28" rx="4"/><text class="d" x="178" y="98" text-anchor="start">forward 1</text><rect class="b-attn" x="290" y="44" width="70" height="28" rx="4"/><text class="d" x="296" y="62" text-anchor="start">sample 1</text><rect class="b-runner" x="360" y="44" width="80" height="28" rx="4"/><text class="d" x="368" y="62" text-anchor="start">build 2</text><rect class="b-kern" x="440" y="80" width="120" height="28" rx="4"/><text class="d" x="448" y="98" text-anchor="start">forward 2</text><rect class="b-attn" x="560" y="44" width="70" height="28" rx="4"/><text class="d" x="566" y="62" text-anchor="start">sample 2</text><rect class="b-runner" x="630" y="44" width="80" height="28" rx="4"/><text class="d" x="638" y="62" text-anchor="start">build 3</text><rect class="b-kern" x="710" y="80" width="120" height="28" rx="4"/><text class="d" x="718" y="98" text-anchor="start">forward 3</text><rect class="b-attn" x="830" y="44" width="70" height="28" rx="4"/><text class="d" x="836" y="62" text-anchor="start">sample 3</text><text class="h k-attn" x="20" y="150" text-anchor="start">With the pipeline: Python builds step n+1 while the GPU still runs step n; tokens stay on the GPU</text><text class="n" x="20" y="184" text-anchor="start">CPU</text><text class="n" x="20" y="220" text-anchor="start">GPU</text><rect class="b-runner" x="90" y="164" width="80" height="28" rx="4"/><text class="d" x="98" y="182" text-anchor="start">build 1</text><rect class="b-kern" x="170" y="200" width="120" height="28" rx="4"/><text class="d" x="178" y="218" text-anchor="start">forward 1</text><rect class="b-runner" x="215" y="164" width="80" height="28" rx="4"/><text class="d" x="223" y="182" text-anchor="start">build 2</text><rect class="b-kern" x="295" y="200" width="120" height="28" rx="4"/><text class="d" x="303" y="218" text-anchor="start">forward 2</text><rect class="b-runner" x="340" y="164" width="80" height="28" rx="4"/><text class="d" x="348" y="182" text-anchor="start">build 3</text><rect class="b-kern" x="420" y="200" width="120" height="28" rx="4"/><text class="d" x="428" y="218" text-anchor="start">forward 3</text><rect class="b-runner" x="465" y="164" width="80" height="28" rx="4"/><text class="d" x="473" y="182" text-anchor="start">build 4</text><rect class="b-kern" x="545" y="200" width="120" height="28" rx="4"/><text class="d" x="553" y="218" text-anchor="start">forward 4</text><rect class="b-runner" x="590" y="164" width="80" height="28" rx="4"/><text class="d" x="598" y="182" text-anchor="start">build 5</text><rect class="b-kern" x="670" y="200" width="120" height="28" rx="4"/><text class="d" x="678" y="218" text-anchor="start">forward 5</text><text class="d" x="20" y="260" text-anchor="start">Used only for plain decode steps with async scheduling on: no new prompts, no spec decode, no grammar.</text></svg>
