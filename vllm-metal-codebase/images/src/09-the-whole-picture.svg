<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" role="img" aria-label="The whole vllm-metal system on one diagram, from the program to the unified memory"><style>.n { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #17202b; }
.d { font: 400 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #576375; }
.cm { font: 500 12px ui-monospace, Menlo, Consolas, monospace; fill: #17202b; }
.h { font: 700 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .07em; text-transform: uppercase; }
.ar { stroke: #576375; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
.arb { stroke: #2a66c9; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrb); }
.tick { stroke: #17202b; stroke-width: 1.5; }
.badge { fill: #17202b; }
.badge-t { font: 700 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f5f6f8; }
.b-vllm { fill: #e5eeff; stroke: #2a66c9; stroke-width: 1.3; }
.b-glue { fill: #efe8ff; stroke: #7448c9; stroke-width: 1.3; }
.b-runner { fill: #fff1dc; stroke: #b56f0c; stroke-width: 1.3; }
.b-attn { fill: #e0f4ea; stroke: #1b8455; stroke-width: 1.3; }
.b-attn2 { fill: #eef9f3; stroke: #1b8455; stroke-width: 1.3; stroke-dasharray: 4 3; }
.b-kern { fill: #fde8e6; stroke: #c2433a; stroke-width: 1.3; }
.b-mlx { fill: #ddf3f5; stroke: #0d7f8c; stroke-width: 1.3; }
.b-hw { fill: #e9edf2; stroke: #5a6577; stroke-width: 1.3; }
.b-prog { fill: #f1f3f6; stroke: #3f4a5a; stroke-width: 1.3; }
.b-soft { fill: #edf0f4; stroke: #c6ced9; stroke-width: 1.2; }
[class^="lane-"] { stroke-width: 1; fill-opacity: .45; }
.lane-vllm { fill: #e5eeff; stroke: #2a66c9; stroke-opacity: .35; }
.lane-glue { fill: #efe8ff; stroke: #7448c9; stroke-opacity: .35; }
.lane-runner { fill: #fff1dc; stroke: #b56f0c; stroke-opacity: .35; }
.lane-attn { fill: #e0f4ea; stroke: #1b8455; stroke-opacity: .35; }
.lane-kern { fill: #fde8e6; stroke: #c2433a; stroke-opacity: .35; }
.lane-mlx { fill: #ddf3f5; stroke: #0d7f8c; stroke-opacity: .35; }
.lane-hw { fill: #e9edf2; stroke: #5a6577; stroke-opacity: .35; }
.lane-prog { fill: #f1f3f6; stroke: #3f4a5a; stroke-opacity: .35; }
.k-vllm { fill: #2a66c9; } .k-glue { fill: #7448c9; } .k-runner { fill: #b56f0c; }
.k-attn { fill: #1b8455; } .k-kern { fill: #c2433a; } .k-mlx { fill: #0d7f8c; }
.k-hw { fill: #5a6577; } .k-prog { fill: #3f4a5a; }
.mk { fill: #576375; } .mkb { fill: #2a66c9; }</style><defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path fill="#576375" d="M0,0 L9,4.5 L0,9 z"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path fill="#2a66c9" d="M0,0 L9,4.5 L0,9 z"/></marker>
  </defs><rect width="100%" height="100%" fill="#ffffff"/><rect class="lane-vllm" x="20" y="14" width="1200" height="128" rx="10"/><text class="h k-vllm" x="36" y="40">vLLM (upstream): plans the work</text><rect class="b-prog" x="36" y="54" width="190" height="72" rx="7"/><text class="n" x="48" y="74">Your program</text><text class="d" x="48" y="92">vllm serve, LLM(),</text><text class="d" x="48" y="107">an HTTP client</text><rect class="b-vllm" x="266" y="54" width="220" height="72" rx="7"/><text class="n" x="278" y="74">API server</text><text class="d" x="278" y="92">tokenizes, streams tokens</text><text class="d" x="278" y="107">back to the client</text><rect class="b-vllm" x="526" y="54" width="300" height="72" rx="7"/><text class="n" x="538" y="74">EngineCore + Scheduler</text><text class="d" x="538" y="92">picks requests and token counts,</text><text class="d" x="538" y="107">hands out KV block ids</text><rect class="b-vllm" x="866" y="54" width="338" height="72" rx="7"/><text class="n" x="878" y="74">Sampler, structured output</text><text class="d" x="878" y="92">borrowed by the runner when</text><text class="d" x="878" y="107">sampling is not plain argmax</text><path class="ar" d="M226,90 L262,90"/><path class="ar" d="M486,90 L522,90"/><circle class="badge" cx="246" cy="112" r="10"/><text class="badge-t" x="246" y="116" text-anchor="middle">1</text><circle class="badge" cx="506" cy="112" r="10"/><text class="badge-t" x="506" y="116" text-anchor="middle">2</text><rect class="lane-glue" x="20" y="160" width="270" height="392" rx="10"/><text class="h k-glue" x="36" y="186">Glue</text><rect class="b-glue" x="36" y="200" width="238" height="128" rx="7"/><text class="n" x="48" y="220">MetalWorker</text><text class="d" x="48" y="238">init_device, load_model,</text><text class="d" x="48" y="253">determine_available_memory,</text><text class="d" x="48" y="268" text-anchor="start">initialize_from_config, warm up,</text><text class="d" x="48" y="283" text-anchor="start">execute_model, sample_tokens,</text><text class="d" x="48" y="298" text-anchor="start">sleep, wake_up</text><rect class="b-glue" x="36" y="342" width="238" height="76" rx="7"/><text class="n" x="48" y="362">MetalPlatform</text><text class="d" x="48" y="380">startup checks, memory budget,</text><text class="d" x="48" y="395">worker class, offload setup</text><rect class="b-glue" x="36" y="432" width="238" height="60" rx="7"/><text class="n" x="48" y="455">register(), compat, envs</text><text class="d" x="48" y="473">entry point, patches, settings</text><rect class="b-soft" x="36" y="504" width="238" height="38" rx="5"/><text class="n" x="48" y="528.0">MPSWorker (experimental)</text><rect class="lane-runner" x="306" y="160" width="500" height="392" rx="10"/><text class="h k-runner" x="322" y="186">MetalModelRunner: runs one step</text><rect class="b-soft" x="322" y="200" width="210" height="42" rx="5"/><text class="n" x="334" y="217">ModelLifecycle</text><text class="d" x="334" y="235">mlx_lm, mlx_vlm, GGUF, AWQ</text><rect class="b-soft" x="322" y="248" width="210" height="42" rx="5"/><text class="n" x="334" y="265">ModelAdapter</text><text class="d" x="334" y="283">per-model quirks</text><rect class="b-soft" x="322" y="296" width="210" height="42" rx="5"/><text class="n" x="334" y="313">ModelCachePolicy</text><text class="d" x="334" y="331">KV specs, runtime, memory plan</text><rect class="b-soft" x="322" y="344" width="210" height="42" rx="5"/><text class="n" x="334" y="361">DecodePipeline</text><text class="d" x="334" y="379">overlap decode steps</text><rect class="b-soft" x="322" y="392" width="210" height="42" rx="5"/><text class="n" x="334" y="409">drafters</text><text class="d" x="334" y="427">ngram, draft model, MTP, DFlash</text><rect class="b-soft" x="322" y="440" width="210" height="42" rx="5"/><text class="n" x="334" y="457">LoRA, multimodal</text><text class="d" x="334" y="475">adapters, image encoders</text><rect class="b-soft" x="322" y="488" width="210" height="42" rx="5"/><text class="n" x="334" y="505">pooling, diffusion</text><text class="d" x="334" y="523">embeddings, block diffusion</text><rect class="b-runner" x="548" y="200" width="242" height="54" rx="7"/><text class="n" x="560" y="220">build the batch</text><text class="d" x="560" y="238">decode rows first, then prefill</text><rect class="b-runner" x="548" y="270" width="242" height="54" rx="7"/><text class="n" x="560" y="290">PagedAttentionContext</text><text class="d" x="560" y="308">slots, block tables, cu_seqlens</text><path class="ar" d="M669,254 L669,268"/><rect class="b-runner" x="548" y="340" width="242" height="54" rx="7"/><text class="n" x="560" y="360">model forward (mlx_lm)</text><text class="d" x="560" y="378">then logits, mx.async_eval</text><path class="ar" d="M669,324 L669,338"/><rect class="b-runner" x="548" y="410" width="242" height="54" rx="7"/><text class="n" x="560" y="430">sample, verify drafts</text><text class="d" x="560" y="448">then drafter.propose()</text><path class="ar" d="M669,394 L669,408"/><circle class="badge" cx="772" cy="216" r="10"/><text class="badge-t" x="772" y="220" text-anchor="middle">4</text><circle class="badge" cx="772" cy="356" r="10"/><text class="badge-t" x="772" y="360" text-anchor="middle">5</text><circle class="badge" cx="772" cy="426" r="10"/><text class="badge-t" x="772" y="430" text-anchor="middle">8</text><path class="ar" d="M669,126 L669,196"/><circle class="badge" cx="686" cy="152" r="10"/><text class="badge-t" x="686" y="156" text-anchor="middle">3</text><text class="cm" x="652" y="156" text-anchor="end">via MetalWorker.execute_model()</text><rect class="lane-attn" x="822" y="160" width="398" height="392" rx="10"/><text class="h k-attn" x="838" y="186">Attention and kernels</text><rect class="b-attn" x="838" y="200" width="366" height="54" rx="7"/><text class="n" x="850" y="220">wrapped attention layers</text><text class="d" x="850" y="238">patching.py swaps self_attn, linear_attn, conv</text><rect class="b-attn" x="838" y="268" width="178" height="66" rx="7"/><text class="n" x="850" y="288">runtimes</text><text class="d" x="850" y="306">SDPA, MLA, Hybrid</text><text class="d" x="850" y="321">gdn, shortconv, mamba2</text><rect class="b-attn" x="1026" y="268" width="178" height="66" rx="7"/><text class="n" x="1038" y="288">KVCacheStorage</text><text class="d" x="1038" y="306">one region per layer,</text><text class="d" x="1038" y="321">release / reallocate</text><rect class="b-kern" x="838" y="348" width="366" height="66" rx="7"/><text class="n" x="850" y="368">paged_ops.cpp</text><text class="d" x="850" y="386">write: reshape_and_cache</text><text class="d" x="850" y="401">read: paged_attention_primitive</text><rect class="b-kern" x="838" y="428" width="366" height="66" rx="7"/><text class="n" x="850" y="448">kernels_v2/*.metal</text><text class="d" x="850" y="466">NAX (M5), tiled (FA2 style), per-token,</text><text class="d" x="850" y="481">MLA, TurboQuant, GDN state kernels</text><text class="d" x="838" y="522" text-anchor="start">prebuilt by metal/build.py</text><path class="ar" d="M927,254 L927,264"/><path class="ar" d="M927,334 L927,344"/><path class="ar" d="M927,414 L927,424"/><path class="ar" d="M1115,348 L1115,338"/><circle class="badge" cx="1186" cy="366" r="10"/><text class="badge-t" x="1186" y="370" text-anchor="middle">7</text><path class="ar" d="M790,297 C810,297 812,227 834,227"/><circle class="badge" cx="806" cy="250" r="10"/><text class="badge-t" x="806" y="254" text-anchor="middle">6</text><path class="arb" d="M790,467 L814,467 L814,132"/><circle class="badge" cx="814" cy="510" r="10"/><text class="badge-t" x="814" y="514" text-anchor="middle">9</text><rect class="lane-hw" x="20" y="572" width="1200" height="226" rx="10"/><text class="h k-hw" x="36" y="598">Apple Silicon: CPU and GPU share one unified memory</text><rect class="b-hw" x="36" y="612" width="264" height="62" rx="7"/><text class="n" x="48" y="635">macOS and other apps</text><text class="d" x="48" y="653">share the same budget</text><rect class="b-mlx" x="306" y="612" width="250" height="62" rx="7"/><text class="n" x="318" y="635">model weights</text><text class="d" x="318" y="653">loaded once by ModelLifecycle</text><rect class="b-glue" x="562" y="612" width="238" height="62" rx="7"/><text class="n" x="574" y="635">offload host pool</text><text class="d" x="574" y="653">KV blocks that left the pool</text><rect class="b-attn" x="806" y="612" width="274" height="62" rx="7"/><text class="n" x="818" y="635">KV pool</text><text class="d" x="818" y="653">blocks of 16 tokens, lazy</text><rect class="b-attn2" x="1086" y="612" width="128" height="62" rx="7"/><text class="n" x="1098" y="635">state pools</text><text class="d" x="1098" y="653">hybrid models</text><path class="ar" d="M1040,494 L1040,608"/><rect class="b-soft" x="36" y="700" width="380" height="82" rx="7"/><text class="n" x="48" y="720">second Mac (pipeline parallel)</text><text class="d" x="48" y="738">layers split across Macs; hidden states</text><text class="d" x="48" y="753">sent over the mx.distributed ring</text><rect class="b-soft" x="430" y="700" width="380" height="82" rx="7"/><text class="n" x="442" y="720">disk tier (KV offload)</text><text class="d" x="442" y="738">a folder for KV blocks that do not fit</text><text class="d" x="442" y="753">in the host pool</text><rect class="b-soft" x="824" y="700" width="380" height="82" rx="7"/><text class="n" x="836" y="720">sleep(level=1)</text><text class="d" x="836" y="738">frees the KV pool, keeps the weights;</text><text class="d" x="836" y="753">wake_up() makes the same layout again</text><path class="ar" d="M685,674 L685,696"/><path class="ar" d="M1040,674 L1040,696"/><circle class="badge" cx="36" cy="832" r="10"/><text class="badge-t" x="36" y="836" text-anchor="middle">1</text><text class="n" x="56" y="836" text-anchor="start">A prompt arrives at the API server.</text><circle class="badge" cx="36" cy="862" r="10"/><text class="badge-t" x="36" y="866" text-anchor="middle">2</text><text class="n" x="56" y="866" text-anchor="start">The scheduler picks requests, token counts and KV block ids.</text><circle class="badge" cx="36" cy="892" r="10"/><text class="badge-t" x="36" y="896" text-anchor="middle">3</text><text class="n" x="56" y="896" text-anchor="start">EngineCore calls the worker, which calls the runner.</text><circle class="badge" cx="36" cy="922" r="10"/><text class="badge-t" x="36" y="926" text-anchor="middle">4</text><text class="n" x="56" y="926" text-anchor="start">The runner packs one batch and sets the attention context.</text><circle class="badge" cx="36" cy="952" r="10"/><text class="badge-t" x="36" y="956" text-anchor="middle">5</text><text class="n" x="56" y="956" text-anchor="start">The mlx_lm model runs; MLX builds a lazy graph.</text><circle class="badge" cx="636" cy="832" r="10"/><text class="badge-t" x="636" y="836" text-anchor="middle">6</text><text class="n" x="656" y="836" text-anchor="start">Each wrapped attention layer reads the context.</text><circle class="badge" cx="636" cy="862" r="10"/><text class="badge-t" x="636" y="866" text-anchor="middle">7</text><text class="n" x="656" y="866" text-anchor="start">Native ops write new K and V, then read old K and V.</text><circle class="badge" cx="636" cy="892" r="10"/><text class="badge-t" x="636" y="896" text-anchor="middle">8</text><text class="n" x="656" y="896" text-anchor="start">The runner samples tokens and proposes drafts.</text><circle class="badge" cx="636" cy="922" r="10"/><text class="badge-t" x="636" y="926" text-anchor="middle">9</text><text class="n" x="656" y="926" text-anchor="start">Tokens go back to the scheduler, then stream to you.</text></svg>
