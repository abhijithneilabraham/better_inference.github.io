<svg xmlns="http://www.w3.org/2000/svg" width="960" height="482" viewBox="0 0 960 482" role="img" aria-label="Layout of the paged KV cache in memory, with a worked example of a slot mapping"><style>.n { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #17202b; }
.d { font: 400 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #576375; }
.cm { font: 500 12px ui-monospace, Menlo, Consolas, monospace; fill: #17202b; }
.h { font: 700 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .07em; text-transform: uppercase; }
.ar { stroke: #576375; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
.arb { stroke: #2a66c9; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrb); }
.tick { stroke: #17202b; stroke-width: 1.5; }
.badge { fill: #17202b; }
.badge-t { font: 700 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f5f6f8; }
.b-vllm { fill: #e5eeff; stroke: #2a66c9; stroke-width: 1.3; }
.b-glue { fill: #efe8ff; stroke: #7448c9; stroke-width: 1.3; }
.b-runner { fill: #fff1dc; stroke: #b56f0c; stroke-width: 1.3; }
.b-attn { fill: #e0f4ea; stroke: #1b8455; stroke-width: 1.3; }
.b-attn2 { fill: #eef9f3; stroke: #1b8455; stroke-width: 1.3; stroke-dasharray: 4 3; }
.b-kern { fill: #fde8e6; stroke: #c2433a; stroke-width: 1.3; }
.b-mlx { fill: #ddf3f5; stroke: #0d7f8c; stroke-width: 1.3; }
.b-hw { fill: #e9edf2; stroke: #5a6577; stroke-width: 1.3; }
.b-prog { fill: #f1f3f6; stroke: #3f4a5a; stroke-width: 1.3; }
.b-soft { fill: #edf0f4; stroke: #c6ced9; stroke-width: 1.2; }
[class^="lane-"] { stroke-width: 1; fill-opacity: .45; }
.lane-vllm { fill: #e5eeff; stroke: #2a66c9; stroke-opacity: .35; }
.lane-glue { fill: #efe8ff; stroke: #7448c9; stroke-opacity: .35; }
.lane-runner { fill: #fff1dc; stroke: #b56f0c; stroke-opacity: .35; }
.lane-attn { fill: #e0f4ea; stroke: #1b8455; stroke-opacity: .35; }
.lane-kern { fill: #fde8e6; stroke: #c2433a; stroke-opacity: .35; }
.lane-mlx { fill: #ddf3f5; stroke: #0d7f8c; stroke-opacity: .35; }
.lane-hw { fill: #e9edf2; stroke: #5a6577; stroke-opacity: .35; }
.lane-prog { fill: #f1f3f6; stroke: #3f4a5a; stroke-opacity: .35; }
.k-vllm { fill: #2a66c9; } .k-glue { fill: #7448c9; } .k-runner { fill: #b56f0c; }
.k-attn { fill: #1b8455; } .k-kern { fill: #c2433a; } .k-mlx { fill: #0d7f8c; }
.k-hw { fill: #5a6577; } .k-prog { fill: #3f4a5a; }
.mk { fill: #576375; } .mkb { fill: #2a66c9; }</style><defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path fill="#576375" d="M0,0 L9,4.5 L0,9 z"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path fill="#2a66c9" d="M0,0 L9,4.5 L0,9 z"/></marker>
  </defs><rect width="100%" height="100%" fill="#ffffff"/><text class="n" x="20" y="30" text-anchor="start">The KV pool: one region per layer, each region cut into blocks (layout LBNHC: layer, block, token, head, content)</text><rect class="b-attn" x="20" y="44" width="170" height="36" rx="4"/><text class="n" x="30" y="67" text-anchor="start">layer 0</text><rect class="b-attn" x="203" y="44" width="170" height="36" rx="4"/><text class="n" x="213" y="67" text-anchor="start">layer 1</text><rect class="b-attn" x="386" y="44" width="170" height="36" rx="4"/><text class="n" x="396" y="67" text-anchor="start">layer 2</text><rect class="b-attn" x="569" y="44" width="170" height="36" rx="4"/><text class="n" x="579" y="67" text-anchor="start">...</text><rect class="b-attn" x="752" y="44" width="170" height="36" rx="4"/><text class="n" x="762" y="67" text-anchor="start">layer L-1</text><text class="d" x="60" y="112" text-anchor="start">Layer 0, cut into blocks. Request A owns blocks 7, 2 and 9, in that order.</text><rect class="b-soft" x="20" y="122" width="52" height="40" rx="4"/><text class="cm" x="46" y="147" text-anchor="middle">0</text><rect class="b-soft" x="77" y="122" width="52" height="40" rx="4"/><text class="cm" x="103" y="147" text-anchor="middle">1</text><rect class="b-runner" x="134" y="122" width="52" height="40" rx="4"/><text class="cm" x="160" y="147" text-anchor="middle">2</text><rect class="b-soft" x="191" y="122" width="52" height="40" rx="4"/><text class="cm" x="217" y="147" text-anchor="middle">3</text><rect class="b-soft" x="248" y="122" width="52" height="40" rx="4"/><text class="cm" x="274" y="147" text-anchor="middle">4</text><rect class="b-soft" x="305" y="122" width="52" height="40" rx="4"/><text class="cm" x="331" y="147" text-anchor="middle">5</text><rect class="b-soft" x="362" y="122" width="52" height="40" rx="4"/><text class="cm" x="388" y="147" text-anchor="middle">6</text><rect class="b-runner" x="419" y="122" width="52" height="40" rx="4"/><text class="cm" x="445" y="147" text-anchor="middle">7</text><rect class="b-soft" x="476" y="122" width="52" height="40" rx="4"/><text class="cm" x="502" y="147" text-anchor="middle">8</text><rect class="b-runner" x="533" y="122" width="52" height="40" rx="4"/><text class="cm" x="559" y="147" text-anchor="middle">9</text><rect class="b-soft" x="590" y="122" width="52" height="40" rx="4"/><text class="cm" x="616" y="147" text-anchor="middle">10</text><rect class="b-soft" x="647" y="122" width="52" height="40" rx="4"/><text class="cm" x="673" y="147" text-anchor="middle">11</text><rect class="b-soft" x="704" y="122" width="52" height="40" rx="4"/><text class="cm" x="730" y="147" text-anchor="middle">12</text><rect class="b-soft" x="761" y="122" width="52" height="40" rx="4"/><text class="cm" x="787" y="147" text-anchor="middle">13</text><rect class="b-soft" x="818" y="122" width="52" height="40" rx="4"/><text class="cm" x="844" y="147" text-anchor="middle">14</text><rect class="b-soft" x="875" y="122" width="52" height="40" rx="4"/><text class="cm" x="901" y="147" text-anchor="middle">15</text><path class="ar" d="M44,82 L44,118"/><text class="n" x="20" y="200" text-anchor="start">Block table for request A</text><rect class="b-runner" x="20" y="212" width="86" height="54" rx="4"/><text class="d" x="63" y="232" text-anchor="middle">logical 0</text><text class="cm" x="63" y="254" text-anchor="middle">block 7</text><rect class="b-runner" x="112" y="212" width="86" height="54" rx="4"/><text class="d" x="155" y="232" text-anchor="middle">logical 1</text><text class="cm" x="155" y="254" text-anchor="middle">block 2</text><rect class="b-runner" x="204" y="212" width="86" height="54" rx="4"/><text class="d" x="247" y="232" text-anchor="middle">logical 2</text><text class="cm" x="247" y="254" text-anchor="middle">block 9</text><text class="n" x="20" y="300" text-anchor="start">Where does token 37 of request A go?</text><text class="cm" x="20" y="322" text-anchor="start">logical block = 37 // 16 = 2   -&gt;  physical block 9</text><text class="cm" x="20" y="344" text-anchor="start">offset inside the block = 37 % 16 = 5</text><text class="cm" x="20" y="366" text-anchor="start">slot = 9 x 16 + 5 = 149   (slot_mapping[that token] = 149)</text><text class="n" x="470" y="196" text-anchor="start">Inside block 9: 16 token rows</text><rect class="b-attn" x="470" y="208" width="170" height="12" rx="2"/><rect class="b-attn" x="644" y="208" width="170" height="12" rx="2"/><text class="d" x="822" y="218" text-anchor="start">token 0</text><rect class="b-attn" x="470" y="222" width="170" height="12" rx="2"/><rect class="b-attn" x="644" y="222" width="170" height="12" rx="2"/><rect class="b-attn" x="470" y="236" width="170" height="12" rx="2"/><rect class="b-attn" x="644" y="236" width="170" height="12" rx="2"/><rect class="b-attn" x="470" y="250" width="170" height="12" rx="2"/><rect class="b-attn" x="644" y="250" width="170" height="12" rx="2"/><rect class="b-attn" x="470" y="264" width="170" height="12" rx="2"/><rect class="b-attn" x="644" y="264" width="170" height="12" rx="2"/><rect class="b-kern" x="470" y="278" width="170" height="12" rx="2"/><rect class="b-kern" x="644" y="278" width="170" height="12" rx="2"/><text class="d" x="822" y="288" text-anchor="start">token 5</text><rect class="b-attn" x="470" y="292" width="170" height="12" rx="2"/><rect class="b-attn" x="644" y="292" width="170" height="12" rx="2"/><rect class="b-attn" x="470" y="306" width="170" height="12" rx="2"/><rect class="b-attn" x="644" y="306" width="170" height="12" rx="2"/><rect class="b-attn" x="470" y="320" width="170" height="12" rx="2"/><rect class="b-attn" x="644" y="320" width="170" height="12" rx="2"/><rect class="b-attn" x="470" y="334" width="170" height="12" rx="2"/><rect class="b-attn" x="644" y="334" width="170" height="12" rx="2"/><rect class="b-attn" x="470" y="348" width="170" height="12" rx="2"/><rect class="b-attn" x="644" y="348" width="170" height="12" rx="2"/><rect class="b-attn" x="470" y="362" width="170" height="12" rx="2"/><rect class="b-attn" x="644" y="362" width="170" height="12" rx="2"/><rect class="b-attn" x="470" y="376" width="170" height="12" rx="2"/><rect class="b-attn" x="644" y="376" width="170" height="12" rx="2"/><rect class="b-attn" x="470" y="390" width="170" height="12" rx="2"/><rect class="b-attn" x="644" y="390" width="170" height="12" rx="2"/><rect class="b-attn" x="470" y="404" width="170" height="12" rx="2"/><rect class="b-attn" x="644" y="404" width="170" height="12" rx="2"/><rect class="b-attn" x="470" y="418" width="170" height="12" rx="2"/><rect class="b-attn" x="644" y="418" width="170" height="12" rx="2"/><text class="d" x="822" y="428" text-anchor="start">token 15</text><text class="cm" x="470" y="448" text-anchor="start">head 0: [ K | V ]</text><text class="cm" x="644" y="448" text-anchor="start">head 1: [ K | V ]</text><text class="d" x="470" y="468" text-anchor="start">row 5 is slot 149: K and V of every KV head for token 37</text><path class="ar" d="M559,164 C559,180 590,180 590,182"/></svg>
