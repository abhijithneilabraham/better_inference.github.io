<svg xmlns="http://www.w3.org/2000/svg" width="960" height="566" viewBox="0 0 960 566" role="img" aria-label="The layers of vllm-metal, from your program down to the Apple Silicon unified memory"><style>.n { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #17202b; }
.d { font: 400 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #576375; }
.cm { font: 500 12px ui-monospace, Menlo, Consolas, monospace; fill: #17202b; }
.h { font: 700 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .07em; text-transform: uppercase; }
.ar { stroke: #576375; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
.arb { stroke: #2a66c9; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrb); }
.tick { stroke: #17202b; stroke-width: 1.5; }
.badge { fill: #17202b; }
.badge-t { font: 700 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f5f6f8; }
.b-vllm { fill: #e5eeff; stroke: #2a66c9; stroke-width: 1.3; }
.b-glue { fill: #efe8ff; stroke: #7448c9; stroke-width: 1.3; }
.b-runner { fill: #fff1dc; stroke: #b56f0c; stroke-width: 1.3; }
.b-attn { fill: #e0f4ea; stroke: #1b8455; stroke-width: 1.3; }
.b-attn2 { fill: #eef9f3; stroke: #1b8455; stroke-width: 1.3; stroke-dasharray: 4 3; }
.b-kern { fill: #fde8e6; stroke: #c2433a; stroke-width: 1.3; }
.b-mlx { fill: #ddf3f5; stroke: #0d7f8c; stroke-width: 1.3; }
.b-hw { fill: #e9edf2; stroke: #5a6577; stroke-width: 1.3; }
.b-prog { fill: #f1f3f6; stroke: #3f4a5a; stroke-width: 1.3; }
.b-soft { fill: #edf0f4; stroke: #c6ced9; stroke-width: 1.2; }
[class^="lane-"] { stroke-width: 1; fill-opacity: .45; }
.lane-vllm { fill: #e5eeff; stroke: #2a66c9; stroke-opacity: .35; }
.lane-glue { fill: #efe8ff; stroke: #7448c9; stroke-opacity: .35; }
.lane-runner { fill: #fff1dc; stroke: #b56f0c; stroke-opacity: .35; }
.lane-attn { fill: #e0f4ea; stroke: #1b8455; stroke-opacity: .35; }
.lane-kern { fill: #fde8e6; stroke: #c2433a; stroke-opacity: .35; }
.lane-mlx { fill: #ddf3f5; stroke: #0d7f8c; stroke-opacity: .35; }
.lane-hw { fill: #e9edf2; stroke: #5a6577; stroke-opacity: .35; }
.lane-prog { fill: #f1f3f6; stroke: #3f4a5a; stroke-opacity: .35; }
.k-vllm { fill: #2a66c9; } .k-glue { fill: #7448c9; } .k-runner { fill: #b56f0c; }
.k-attn { fill: #1b8455; } .k-kern { fill: #c2433a; } .k-mlx { fill: #0d7f8c; }
.k-hw { fill: #5a6577; } .k-prog { fill: #3f4a5a; }
.mk { fill: #576375; } .mkb { fill: #2a66c9; }</style><defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path fill="#576375" d="M0,0 L9,4.5 L0,9 z"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path fill="#2a66c9" d="M0,0 L9,4.5 L0,9 z"/></marker>
  </defs><rect width="100%" height="100%" fill="#ffffff"/><rect class="lane-prog" x="20" y="16" width="920" height="56" rx="8"/><text class="h k-prog" x="34" y="40">Your program</text><text class="d" x="34" y="58" text-anchor="start">asks for text</text><rect class="b-prog" x="212.0" y="22" width="236.0" height="44" rx="5"/><text class="n" x="224.0" y="39">vllm serve</text><text class="d" x="224.0" y="57">OpenAI-style HTTP server</text><rect class="b-prog" x="458.0" y="22" width="236.0" height="44" rx="5"/><text class="n" x="470.0" y="39">LLM(...)</text><text class="d" x="470.0" y="57">the Python API</text><rect class="b-prog" x="704.0" y="22" width="236.0" height="44" rx="5"/><text class="n" x="716.0" y="39">curl / client</text><text class="d" x="716.0" y="57">sends prompts, gets tokens</text><rect class="lane-vllm" x="20" y="80" width="920" height="56" rx="8"/><text class="h k-vllm" x="34" y="104">vLLM</text><text class="d" x="34" y="122" text-anchor="start">plans the work</text><rect class="b-vllm" x="212.0" y="86" width="174.5" height="44" rx="5"/><text class="n" x="224.0" y="103">API server</text><text class="d" x="224.0" y="121">tokenize, stream back</text><rect class="b-vllm" x="396.5" y="86" width="174.5" height="44" rx="5"/><text class="n" x="408.5" y="103">EngineCore</text><text class="d" x="408.5" y="121">the main loop</text><rect class="b-vllm" x="581.0" y="86" width="174.5" height="44" rx="5"/><text class="n" x="593.0" y="103">Scheduler</text><text class="d" x="593.0" y="121">who runs, how many tokens</text><rect class="b-vllm" x="765.5" y="86" width="174.5" height="44" rx="5"/><text class="n" x="777.5" y="103">KV block manager</text><text class="d" x="777.5" y="121">block ids per request</text><rect class="lane-glue" x="20" y="144" width="920" height="56" rx="8"/><text class="h k-glue" x="34" y="168">vllm-metal: glue</text><text class="d" x="34" y="186" text-anchor="start">joins vLLM to the Mac</text><rect class="b-glue" x="212.0" y="150" width="236.0" height="44" rx="5"/><text class="n" x="224.0" y="167">register()  compat  envs</text><text class="d" x="224.0" y="185">entry point and patches</text><rect class="b-glue" x="458.0" y="150" width="236.0" height="44" rx="5"/><text class="n" x="470.0" y="167">MetalPlatform</text><text class="d" x="470.0" y="185">platform.py: checks, defaults</text><rect class="b-glue" x="704.0" y="150" width="236.0" height="44" rx="5"/><text class="n" x="716.0" y="167">MetalWorker</text><text class="d" x="716.0" y="185">v1/worker.py: lifecycle</text><rect class="lane-runner" x="20" y="208" width="920" height="56" rx="8"/><text class="h k-runner" x="34" y="232">vllm-metal: runner</text><text class="d" x="34" y="250" text-anchor="start">runs one step</text><rect class="b-runner" x="212.0" y="214" width="174.5" height="44" rx="5"/><text class="n" x="224.0" y="231">MetalModelRunner</text><text class="d" x="224.0" y="249">build batch, forward, sample</text><rect class="b-runner" x="396.5" y="214" width="174.5" height="44" rx="5"/><text class="n" x="408.5" y="231">ModelLifecycle + Adapter</text><text class="d" x="408.5" y="249">load and drive the model</text><rect class="b-runner" x="581.0" y="214" width="174.5" height="44" rx="5"/><text class="n" x="593.0" y="231">ModelCachePolicy</text><text class="d" x="593.0" y="249">KV specs, memory plan</text><rect class="b-runner" x="765.5" y="214" width="174.5" height="44" rx="5"/><text class="n" x="777.5" y="231">DecodePipeline, drafters</text><text class="d" x="777.5" y="249">overlap, spec decode</text><rect class="lane-attn" x="20" y="272" width="920" height="56" rx="8"/><text class="h k-attn" x="34" y="296">vllm-metal: attention</text><text class="d" x="34" y="314" text-anchor="start">paged KV cache</text><rect class="b-attn" x="212.0" y="278" width="174.5" height="44" rx="5"/><text class="n" x="224.0" y="295">wrappers (patching.py)</text><text class="d" x="224.0" y="313">swap the attention layer</text><rect class="b-attn" x="396.5" y="278" width="174.5" height="44" rx="5"/><text class="n" x="408.5" y="295">PagedAttentionContext</text><text class="d" x="408.5" y="313">per-step metadata</text><rect class="b-attn" x="581.0" y="278" width="174.5" height="44" rx="5"/><text class="n" x="593.0" y="295">runtimes</text><text class="d" x="593.0" y="313">SDPA, MLA, Hybrid</text><rect class="b-attn" x="765.5" y="278" width="174.5" height="44" rx="5"/><text class="n" x="777.5" y="295">KVCacheStorage</text><text class="d" x="777.5" y="313">owns the KV memory</text><rect class="lane-kern" x="20" y="336" width="920" height="56" rx="8"/><text class="h k-kern" x="34" y="360">native ops</text><text class="d" x="34" y="378" text-anchor="start">C++ and Metal</text><rect class="b-kern" x="212.0" y="342" width="236.0" height="44" rx="5"/><text class="n" x="224.0" y="359">paged_ops.cpp</text><text class="d" x="224.0" y="377">MLX primitives (nanobind)</text><rect class="b-kern" x="458.0" y="342" width="236.0" height="44" rx="5"/><text class="n" x="470.0" y="359">kernels_v2/*.metal</text><text class="d" x="470.0" y="377">paged attention, MLA, TurboQuant</text><rect class="b-kern" x="704.0" y="342" width="236.0" height="44" rx="5"/><text class="n" x="716.0" y="359">GDN lazy kernels</text><text class="d" x="716.0" y="377">for hybrid models, JIT</text><rect class="lane-mlx" x="20" y="400" width="920" height="56" rx="8"/><text class="h k-mlx" x="34" y="424">MLX</text><text class="d" x="34" y="442" text-anchor="start">the array library</text><rect class="b-mlx" x="212.0" y="406" width="236.0" height="44" rx="5"/><text class="n" x="224.0" y="423">mlx_lm / mlx_vlm</text><text class="d" x="224.0" y="441">the model code itself</text><rect class="b-mlx" x="458.0" y="406" width="236.0" height="44" rx="5"/><text class="n" x="470.0" y="423">lazy arrays</text><text class="d" x="470.0" y="441">build a graph, then mx.async_eval</text><rect class="b-mlx" x="704.0" y="406" width="236.0" height="44" rx="5"/><text class="n" x="716.0" y="423">mx.quantized_matmul</text><text class="d" x="716.0" y="441">4-bit and 8-bit weights</text><rect class="lane-hw" x="20" y="464" width="920" height="92" rx="8"/><text class="h k-hw" x="34" y="488">Apple Silicon</text><text class="d" x="34" y="506" text-anchor="start">one memory for all</text><rect class="b-hw" x="212" y="472" width="200" height="30" rx="5"/><text class="n" x="224" y="492.0">CPU cores</text><rect class="b-hw" x="422" y="472" width="200" height="30" rx="5"/><text class="n" x="434" y="492.0">GPU cores</text><text class="d" x="634" y="492" text-anchor="start">both read and write the same memory chips</text><rect class="b-mlx" x="212" y="510" width="170" height="38" rx="4"/><text class="n" x="222" y="534" text-anchor="start">model weights</text><rect class="b-attn" x="382" y="510" width="230" height="38" rx="4"/><text class="n" x="392" y="534" text-anchor="start">KV pool (blocks)</text><rect class="b-attn2" x="612" y="510" width="110" height="38" rx="4"/><text class="n" x="622" y="534" text-anchor="start">state pools</text><rect class="b-hw" x="722" y="510" width="218" height="38" rx="4"/><text class="n" x="732" y="534" text-anchor="start">macOS and other apps</text></svg>
