  </defs><rect width="100%" height="100%" fill="#ffffff"/><rect class="b-kern" x="20" y="14" width="340" height="46" rx="7"/><text class="cm" x="32" y="31">paged_attention_primitive</text><text class="d" x="32" y="49">eval_gpu() in paged_ops.cpp picks a kernel</text><rect class="b-soft" x="20" y="84" width="400" height="54" rx="7"/><text class="n" x="32" y="104">Mixed batch with long decode rows?</text><text class="d" x="32" y="122">a decode row has 4096+ tokens of context</text><path class="ar" d="M420,111 L520,111"/><text class="d" x="470" y="104" text-anchor="middle">yes</text><rect class="b-runner" x="524" y="84" width="416" height="54" rx="7"/><text class="n" x="536" y="104">split</text><text class="d" x="536" y="122">long decode rows go to the per-token path; the rest go on below</text><text class="d" x="214" y="154" text-anchor="start">no</text><rect class="b-soft" x="20" y="158" width="400" height="54" rx="7"/><text class="n" x="32" y="178">Prefill on an M5 chip?</text><text class="d" x="32" y="196">fp16/bf16, head size 64..512, block 8/16/32</text><path class="ar" d="M420,185 L520,185"/><text class="d" x="470" y="178" text-anchor="middle">yes</text><rect class="b-kern" x="524" y="158" width="416" height="54" rx="7"/><text class="cm" x="536" y="178">pagedattention_nax.metal</text><text class="d" x="536" y="196">uses the M5 neural accelerators (NAX)</text><path class="ar" d="M200,138 L200,156"/><text class="d" x="214" y="228" text-anchor="start">no</text><rect class="b-soft" x="20" y="232" width="400" height="54" rx="7"/><text class="n" x="32" y="252">Prefill with a tiled head size?</text><text class="d" x="32" y="270">head size 64, 96, 128, 256 or 512</text><path class="ar" d="M420,259 L520,259"/><text class="d" x="470" y="252" text-anchor="middle">yes</text><rect class="b-kern" x="524" y="232" width="416" height="54" rx="7"/><text class="cm" x="536" y="252">pagedattention_tiled.metal</text><text class="d" x="536" y="270">FlashAttention-2 style tiles of 32 queries</text><path class="ar" d="M200,212 L200,230"/><text class="d" x="214" y="302" text-anchor="start">no</text><rect class="b-soft" x="20" y="306" width="400" height="54" rx="7"/><text class="n" x="32" y="326">Otherwise: per-token kernel</text><text class="d" x="32" y="344">one GPU thread group per (head, query token)</text><path class="ar" d="M420,333 L520,333"/><text class="d" x="470" y="326" text-anchor="middle"></text><rect class="b-kern" x="524" y="306" width="416" height="54" rx="7"/><text class="cm" x="536" y="326">pagedattention.metal</text><text class="d" x="536" y="344">GQA decode, split-KV + reduce, or one pass</text><path class="ar" d="M200,286 L200,304"/><path class="ar" d="M200,60 L200,82"/></svg>
