<svg xmlns="http://www.w3.org/2000/svg" width="960" height="766" viewBox="0 0 960 766" role="img" aria-label="Startup sequence of vllm-metal across the API server, EngineCore and worker"><style>.n { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #17202b; }
.d { font: 400 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #576375; }
.cm { font: 500 12px ui-monospace, Menlo, Consolas, monospace; fill: #17202b; }
.h { font: 700 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .07em; text-transform: uppercase; }
.ar { stroke: #576375; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
.arb { stroke: #2a66c9; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrb); }
.tick { stroke: #17202b; stroke-width: 1.5; }
.badge { fill: #17202b; }
.badge-t { font: 700 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f5f6f8; }
.b-vllm { fill: #e5eeff; stroke: #2a66c9; stroke-width: 1.3; }
.b-glue { fill: #efe8ff; stroke: #7448c9; stroke-width: 1.3; }
.b-runner { fill: #fff1dc; stroke: #b56f0c; stroke-width: 1.3; }
.b-attn { fill: #e0f4ea; stroke: #1b8455; stroke-width: 1.3; }
.b-attn2 { fill: #eef9f3; stroke: #1b8455; stroke-width: 1.3; stroke-dasharray: 4 3; }
.b-kern { fill: #fde8e6; stroke: #c2433a; stroke-width: 1.3; }
.b-mlx { fill: #ddf3f5; stroke: #0d7f8c; stroke-width: 1.3; }
.b-hw { fill: #e9edf2; stroke: #5a6577; stroke-width: 1.3; }
.b-prog { fill: #f1f3f6; stroke: #3f4a5a; stroke-width: 1.3; }
.b-soft { fill: #edf0f4; stroke: #c6ced9; stroke-width: 1.2; }
[class^="lane-"] { stroke-width: 1; fill-opacity: .45; }
.lane-vllm { fill: #e5eeff; stroke: #2a66c9; stroke-opacity: .35; }
.lane-glue { fill: #efe8ff; stroke: #7448c9; stroke-opacity: .35; }
.lane-runner { fill: #fff1dc; stroke: #b56f0c; stroke-opacity: .35; }
.lane-attn { fill: #e0f4ea; stroke: #1b8455; stroke-opacity: .35; }
.lane-kern { fill: #fde8e6; stroke: #c2433a; stroke-opacity: .35; }
.lane-mlx { fill: #ddf3f5; stroke: #0d7f8c; stroke-opacity: .35; }
.lane-hw { fill: #e9edf2; stroke: #5a6577; stroke-opacity: .35; }
.lane-prog { fill: #f1f3f6; stroke: #3f4a5a; stroke-opacity: .35; }
.k-vllm { fill: #2a66c9; } .k-glue { fill: #7448c9; } .k-runner { fill: #b56f0c; }
.k-attn { fill: #1b8455; } .k-kern { fill: #c2433a; } .k-mlx { fill: #0d7f8c; }
.k-hw { fill: #5a6577; } .k-prog { fill: #3f4a5a; }
.mk { fill: #576375; } .mkb { fill: #2a66c9; }</style><defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path fill="#576375" d="M0,0 L9,4.5 L0,9 z"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path fill="#2a66c9" d="M0,0 L9,4.5 L0,9 z"/></marker>
  </defs><rect width="100%" height="100%" fill="#ffffff"/><rect class="lane-vllm" x="20" y="14" width="300" height="742" rx="8"/><text class="h k-vllm" x="34" y="40">API server process</text><rect class="lane-glue" x="330" y="14" width="300" height="742" rx="8"/><text class="h k-glue" x="344" y="40">EngineCore process</text><rect class="lane-runner" x="640" y="14" width="300" height="742" rx="8"/><text class="h k-runner" x="654" y="40">Worker (inside EngineCore by default)</text><rect class="b-vllm" x="54" y="74" width="252" height="46" rx="6"/><text class="cm" x="66" y="91">find the plugin</text><text class="d" x="66" y="109">entry point vllm.platform_plugins</text><circle class="badge" cx="38" cy="97.0" r="10"/><text class="badge-t" x="38" y="101.0" text-anchor="middle">1</text><rect class="b-vllm" x="54" y="136" width="252" height="46" rx="6"/><text class="cm" x="66" y="153">_register()</text><text class="d" x="66" y="171">env defaults, compat patches, MetalPlatform</text><circle class="badge" cx="38" cy="159.0" r="10"/><text class="badge-t" x="38" y="163.0" text-anchor="middle">2</text><path class="ar" d="M180.0,120 L180.0,134"/><rect class="b-vllm" x="54" y="198" width="252" height="46" rx="6"/><text class="cm" x="66" y="215">build VllmConfig</text><text class="d" x="66" y="233">check_and_update_config: worker, checks</text><circle class="badge" cx="38" cy="221.0" r="10"/><text class="badge-t" x="38" y="225.0" text-anchor="middle">3</text><path class="ar" d="M180.0,182 L180.0,196"/><rect class="b-glue" x="364" y="260" width="252" height="46" rx="6"/><text class="cm" x="376" y="277">start EngineCore</text><text class="d" x="376" y="295">load plugins, build the uni executor</text><circle class="badge" cx="348" cy="283.0" r="10"/><text class="badge-t" x="348" y="287.0" text-anchor="middle">4</text><path class="ar" d="M180.0,244 L180.0,252.0 L490.0,252.0 L490.0,258"/><rect class="b-runner" x="674" y="322" width="252" height="46" rx="6"/><text class="cm" x="686" y="339">init_device</text><text class="d" x="686" y="357">MLX device, wired limit, pick the runner</text><circle class="badge" cx="658" cy="345.0" r="10"/><text class="badge-t" x="658" y="349.0" text-anchor="middle">5</text><path class="ar" d="M490.0,306 L490.0,314.0 L800.0,314.0 L800.0,320"/><rect class="b-runner" x="674" y="384" width="252" height="46" rx="6"/><text class="cm" x="686" y="401">load_model</text><text class="d" x="686" y="419">loaders: mlx_lm, mlx_vlm, GGUF, AWQ</text><circle class="badge" cx="658" cy="407.0" r="10"/><text class="badge-t" x="658" y="411.0" text-anchor="middle">6</text><path class="ar" d="M800.0,368 L800.0,382"/><rect class="b-runner" x="674" y="446" width="252" height="46" rx="6"/><text class="cm" x="686" y="463">get_kv_cache_spec</text><text class="d" x="686" y="481">ModelCachePolicy: full, sliding, MLA, state</text><circle class="badge" cx="658" cy="469.0" r="10"/><text class="badge-t" x="658" y="473.0" text-anchor="middle">7</text><path class="ar" d="M800.0,430 L800.0,444"/><rect class="b-runner" x="674" y="508" width="252" height="46" rx="6"/><text class="cm" x="686" y="525">determine_available_memory</text><text class="d" x="686" y="543">limit x util - weights - overhead</text><circle class="badge" cx="658" cy="531.0" r="10"/><text class="badge-t" x="658" y="535.0" text-anchor="middle">8</text><path class="ar" d="M800.0,492 L800.0,506"/><rect class="b-runner" x="674" y="570" width="252" height="46" rx="6"/><text class="cm" x="686" y="587">initialize_from_config</text><text class="d" x="686" y="605">KVCacheStorage, runtime, patch_model</text><circle class="badge" cx="658" cy="593.0" r="10"/><text class="badge-t" x="658" y="597.0" text-anchor="middle">9</text><path class="ar" d="M800.0,554 L800.0,568"/><rect class="b-runner" x="674" y="632" width="252" height="46" rx="6"/><text class="cm" x="686" y="649">compile_or_warm_up_model</text><text class="d" x="686" y="667">a dummy forward, load the kernels</text><circle class="badge" cx="658" cy="655.0" r="10"/><text class="badge-t" x="658" y="659.0" text-anchor="middle">10</text><path class="ar" d="M800.0,616 L800.0,630"/><rect class="b-glue" x="364" y="694" width="252" height="46" rx="6"/><text class="cm" x="376" y="711">busy loop</text><text class="d" x="376" y="729">schedule, execute_model, sample_tokens</text><circle class="badge" cx="348" cy="717.0" r="10"/><text class="badge-t" x="348" y="721.0" text-anchor="middle">11</text><path class="ar" d="M800.0,678 L800.0,686.0 L490.0,686.0 L490.0,692"/></svg>
