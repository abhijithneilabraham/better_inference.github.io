<svg xmlns="http://www.w3.org/2000/svg" width="960" height="654" viewBox="0 0 960 654" role="img" aria-label="One engine step: execute_model builds and submits the batch, sample_tokens waits and samples"><style>.n { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #17202b; }
.d { font: 400 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #576375; }
.cm { font: 500 12px ui-monospace, Menlo, Consolas, monospace; fill: #17202b; }
.h { font: 700 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .07em; text-transform: uppercase; }
.ar { stroke: #576375; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
.arb { stroke: #2a66c9; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrb); }
.tick { stroke: #17202b; stroke-width: 1.5; }
.badge { fill: #17202b; }
.badge-t { font: 700 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f5f6f8; }
.b-vllm { fill: #e5eeff; stroke: #2a66c9; stroke-width: 1.3; }
.b-glue { fill: #efe8ff; stroke: #7448c9; stroke-width: 1.3; }
.b-runner { fill: #fff1dc; stroke: #b56f0c; stroke-width: 1.3; }
.b-attn { fill: #e0f4ea; stroke: #1b8455; stroke-width: 1.3; }
.b-attn2 { fill: #eef9f3; stroke: #1b8455; stroke-width: 1.3; stroke-dasharray: 4 3; }
.b-kern { fill: #fde8e6; stroke: #c2433a; stroke-width: 1.3; }
.b-mlx { fill: #ddf3f5; stroke: #0d7f8c; stroke-width: 1.3; }
.b-hw { fill: #e9edf2; stroke: #5a6577; stroke-width: 1.3; }
.b-prog { fill: #f1f3f6; stroke: #3f4a5a; stroke-width: 1.3; }
.b-soft { fill: #edf0f4; stroke: #c6ced9; stroke-width: 1.2; }
[class^="lane-"] { stroke-width: 1; fill-opacity: .45; }
.lane-vllm { fill: #e5eeff; stroke: #2a66c9; stroke-opacity: .35; }
.lane-glue { fill: #efe8ff; stroke: #7448c9; stroke-opacity: .35; }
.lane-runner { fill: #fff1dc; stroke: #b56f0c; stroke-opacity: .35; }
.lane-attn { fill: #e0f4ea; stroke: #1b8455; stroke-opacity: .35; }
.lane-kern { fill: #fde8e6; stroke: #c2433a; stroke-opacity: .35; }
.lane-mlx { fill: #ddf3f5; stroke: #0d7f8c; stroke-opacity: .35; }
.lane-hw { fill: #e9edf2; stroke: #5a6577; stroke-opacity: .35; }
.lane-prog { fill: #f1f3f6; stroke: #3f4a5a; stroke-opacity: .35; }
.k-vllm { fill: #2a66c9; } .k-glue { fill: #7448c9; } .k-runner { fill: #b56f0c; }
.k-attn { fill: #1b8455; } .k-kern { fill: #c2433a; } .k-mlx { fill: #0d7f8c; }
.k-hw { fill: #5a6577; } .k-prog { fill: #3f4a5a; }
.mk { fill: #576375; } .mkb { fill: #2a66c9; }</style><defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path fill="#576375" d="M0,0 L9,4.5 L0,9 z"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path fill="#2a66c9" d="M0,0 L9,4.5 L0,9 z"/></marker>
  </defs><rect width="100%" height="100%" fill="#ffffff"/><rect class="b-vllm" x="20" y="14" width="920" height="48" rx="7"/><text class="n" x="32" y="31">vLLM Scheduler</text><text class="d" x="32" y="49">SchedulerOutput: which requests run, how many tokens each, which block ids they own</text><rect class="lane-runner" x="20" y="78" width="450" height="460" rx="8"/><text class="h k-runner" x="34" y="102">execute_model(): build and submit</text><rect class="lane-runner" x="490" y="78" width="450" height="460" rx="8"/><text class="h k-runner" x="504" y="102">sample_tokens(): wait and sample</text><rect class="b-runner" x="34" y="114" width="422" height="44" rx="5"/><text class="n" x="46" y="131">reconcile requests</text><text class="d" x="46" y="149">drop finished, preempted; restore resumed</text><rect class="b-runner" x="34" y="174" width="422" height="44" rx="5"/><text class="n" x="46" y="191">sort the requests</text><text class="d" x="46" y="209">new and continuing prompts = prefill; the rest = decode</text><path class="ar" d="M245,159 L245,172"/><rect class="b-runner" x="34" y="234" width="422" height="44" rx="5"/><text class="n" x="46" y="251">add draft tokens</text><text class="d" x="46" y="269">spec decode: a decode row is [last token, drafts...]</text><path class="ar" d="M245,219 L245,232"/><rect class="b-runner" x="34" y="294" width="422" height="44" rx="5"/><text class="n" x="46" y="311">pack one batch</text><text class="d" x="46" y="329">decode rows first, then prefill chunks</text><path class="ar" d="M245,279 L245,292"/><rect class="b-runner" x="34" y="354" width="422" height="44" rx="5"/><text class="cm" x="46" y="371">prepare_grouped()</text><text class="d" x="46" y="389">PagedAttentionContext: slots, block tables, cu_seqlens</text><path class="ar" d="M245,339 L245,352"/><rect class="b-runner" x="34" y="414" width="422" height="44" rx="5"/><text class="n" x="46" y="431">model forward</text><text class="d" x="46" y="449">mlx_lm model, cache = OffsetCache stubs; logits</text><path class="ar" d="M245,399 L245,412"/><rect class="b-runner" x="34" y="474" width="422" height="44" rx="5"/><text class="cm" x="46" y="491">mx.async_eval()</text><text class="d" x="46" y="509">the GPU starts; Python returns at once</text><path class="ar" d="M245,459 L245,472"/><rect class="b-runner" x="504" y="114" width="422" height="44" rx="5"/><text class="n" x="516" y="131">wait for the logits</text><text class="d" x="516" y="149">or hand the step to the decode pipeline</text><rect class="b-runner" x="504" y="174" width="422" height="44" rx="5"/><text class="n" x="516" y="191">grammar mask, sample</text><text class="d" x="516" y="209">MLX argmax, or vLLM&#x27;s Sampler on the CPU</text><path class="ar" d="M715,159 L715,172"/><rect class="b-runner" x="504" y="234" width="422" height="44" rx="5"/><text class="n" x="516" y="251">verify drafts</text><text class="d" x="516" y="269">verify_greedy: keep the matching prefix + 1</text><path class="ar" d="M715,219 L715,232"/><rect class="b-runner" x="504" y="294" width="422" height="44" rx="5"/><text class="n" x="516" y="311">update RequestState</text><text class="d" x="516" y="329">new tokens, sequence lengths</text><path class="ar" d="M715,279 L715,292"/><rect class="b-runner" x="504" y="354" width="422" height="44" rx="5"/><text class="cm" x="516" y="371">drafter.propose()</text><text class="d" x="516" y="389">draft tokens for the next step</text><path class="ar" d="M715,339 L715,352"/><rect class="b-runner" x="504" y="414" width="422" height="44" rx="5"/><text class="cm" x="516" y="431">ModelRunnerOutput</text><text class="d" x="516" y="449">sampled tokens back to the scheduler</text><path class="ar" d="M715,399 L715,412"/><path class="ar" d="M245,62 L245,76"/><path class="ar" d="M456,496 C478,496 478,136 500,136"/><path class="ar" d="M926,436 L950,436 L950,38 L944,38"/><text class="n" x="20" y="560" text-anchor="start">One packed batch for this step (varlen: each request keeps its own length)</text><rect class="b-runner" x="20" y="572" width="31" height="30" rx="3"/><text class="d" x="23" y="618" text-anchor="start">d1</text><rect class="b-runner" x="54" y="572" width="31" height="30" rx="3"/><text class="d" x="57" y="618" text-anchor="start">d2</text><rect class="b-glue" x="88" y="572" width="31" height="30" rx="3"/><rect class="b-glue" x="122" y="572" width="31" height="30" rx="3"/><rect class="b-glue" x="156" y="572" width="31" height="30" rx="3"/><rect class="b-glue" x="190" y="572" width="31" height="30" rx="3"/><text class="d" x="91" y="618" text-anchor="start">d3+3 drafts</text><rect class="b-attn" x="224" y="572" width="31" height="30" rx="3"/><rect class="b-attn" x="258" y="572" width="31" height="30" rx="3"/><rect class="b-attn" x="292" y="572" width="31" height="30" rx="3"/><rect class="b-attn" x="326" y="572" width="31" height="30" rx="3"/><rect class="b-attn" x="360" y="572" width="31" height="30" rx="3"/><rect class="b-attn" x="394" y="572" width="31" height="30" rx="3"/><text class="d" x="227" y="618" text-anchor="start">prefill A</text><rect class="b-mlx" x="428" y="572" width="31" height="30" rx="3"/><rect class="b-mlx" x="462" y="572" width="31" height="30" rx="3"/><rect class="b-mlx" x="496" y="572" width="31" height="30" rx="3"/><rect class="b-mlx" x="530" y="572" width="31" height="30" rx="3"/><text class="d" x="431" y="618" text-anchor="start">prefill B</text><line class="tick" x1="20" y1="566" x2="20" y2="606"/><text class="cm" x="20" y="638" text-anchor="middle">0</text><line class="tick" x1="52.5" y1="566" x2="52.5" y2="606"/><text class="cm" x="52.5" y="638" text-anchor="middle">1</text><line class="tick" x1="86.5" y1="566" x2="86.5" y2="606"/><text class="cm" x="86.5" y="638" text-anchor="middle">2</text><line class="tick" x1="222.5" y1="566" x2="222.5" y2="606"/><text class="cm" x="222.5" y="638" text-anchor="middle">6</text><line class="tick" x1="426.5" y1="566" x2="426.5" y2="606"/><text class="cm" x="426.5" y="638" text-anchor="middle">12</text><line class="tick" x1="562.5" y1="566" x2="562.5" y2="606"/><text class="cm" x="562.5" y="638" text-anchor="middle">16</text><text class="cm" x="580" y="592" text-anchor="start">cu_seqlens = [0, 1, 2, 6, 12, 16]</text><text class="d" x="580" y="610" text-anchor="start">decode rows first, prefill after</text></svg>
