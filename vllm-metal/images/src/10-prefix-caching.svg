<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="Prefix caching. Two requests that start with the same system prompt share the same KV cache blocks, so the shared part is computed only once">
  <style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .n  { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .d  { font: 400 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .m  { font: 600 11px ui-monospace, Menlo, monospace; }
    .cap { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c2cd; }
    .rule { stroke: #2e3a47; stroke-width: 1; }
    .box { fill: #1b2531; stroke: #3d4956; stroke-width: 1.5; }
    .good { fill: #14301f; stroke: #5cc48a; stroke-width: 1.8; }
    .bad { fill: #2a1a1c; stroke: #e5646c; stroke-width: 1.8; }
    .blue { fill: #16314a; stroke: #5aa9e6; stroke-width: 1.8; }
    .amber { fill: #3a2c14; stroke: #f2a541; stroke-width: 1.8; }
    .purple { fill: #2a2140; stroke: #a98be8; stroke-width: 1.8; }
    .g { fill: #5cc48a; } .r { fill: #e5646c; } .b { fill: #5aa9e6; } .a { fill: #f2a541; } .w { fill: #dfe6ee; } .s { fill: #8a97a6; } .p { fill: #a98be8; }
    .arrow { stroke: #8a97a6; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .arrowb { stroke: #5aa9e6; stroke-width: 1.8; fill: none; marker-end: url(#ahb); }
    .arrowg { stroke: #5cc48a; stroke-width: 1.8; fill: none; marker-end: url(#ahg); }
    .arrowa { stroke: #f2a541; stroke-width: 1.8; fill: none; marker-end: url(#aha); }
    .arrowr { stroke: #e5646c; stroke-width: 1.8; fill: none; marker-end: url(#ahr); }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a97a6"/></marker>
    <marker id="ahb" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5aa9e6"/></marker>
    <marker id="ahg" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5cc48a"/></marker>
    <marker id="aha" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f2a541"/></marker>
    <marker id="ahr" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e5646c"/></marker>
  </defs>

  <rect class="bg" width="800" height="330" rx="6"/>
  <text class="h" x="24" y="34">Prefix caching: do the shared part once</text>
  <text class="t" x="776" y="34" text-anchor="end">PREFIX CACHE</text>

  <text class="n" x="24" y="70">request A</text>
  <rect class="good" x="120" y="56" width="360" height="26" rx="4"/><text class="m g" x="300" y="74" text-anchor="middle">"You are a helpful assistant ..." (same)</text>
  <rect class="amber" x="486" y="56" width="200" height="26" rx="4"/><text class="m a" x="586" y="74" text-anchor="middle">"summarise this email"</text>

  <text class="n" x="24" y="120">request B</text>
  <rect class="good" x="120" y="106" width="360" height="26" rx="4" opacity=".45"/><text class="m g" x="300" y="124" text-anchor="middle">same text, found in the cache</text>
  <rect class="amber" x="486" y="106" width="200" height="26" rx="4"/><text class="m a" x="586" y="124" text-anchor="middle">"translate to French"</text>

  <text class="d" x="120" y="156">the shared start is cut into blocks. each block gets a fingerprint (a hash of its tokens).</text>
  <text class="d" x="120" y="172">request B finds the same fingerprints, reuses those blocks, and only computes its own new part.</text>

  <g>
    <text class="n" x="24" y="214">KV blocks</text>
    <rect class="good" x="120" y="198" width="80" height="28" rx="3"/><text class="m g" x="160" y="217" text-anchor="middle">block 7</text>
    <rect class="good" x="206" y="198" width="80" height="28" rx="3"/><text class="m g" x="246" y="217" text-anchor="middle">block 2</text>
    <rect class="good" x="292" y="198" width="80" height="28" rx="3"/><text class="m g" x="332" y="217" text-anchor="middle">block 9</text>
    <text class="d" x="384" y="217">shared by A and B</text>
    <rect class="amber" x="500" y="198" width="80" height="28" rx="3"/><text class="m a" x="540" y="217" text-anchor="middle">A only</text>
    <rect class="amber" x="586" y="198" width="80" height="28" rx="3"/><text class="m a" x="626" y="217" text-anchor="middle">B only</text>
  </g>
  <line class="rule" x1="24" y1="248" x2="776" y2="248"/>
  <text class="cap" x="24" y="274">Chat apps resend the whole conversation every turn, so most of each new request is text the</text>
  <text class="cap" x="24" y="294">server has already seen. Prefix caching turns that into a lookup. It is on by default for most models.</text>

</svg>
