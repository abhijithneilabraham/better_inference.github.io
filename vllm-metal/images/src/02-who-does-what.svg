<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img" aria-label="One question, four helpers. vLLM is the manager that takes the question and plans the step. vllm-metal is the head chef that runs the plan on a Mac. mlx_lm is the recipe book that knows how the model is built. MLX and Metal are the stove that does the maths on the GPU">
  <style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .n  { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .d  { font: 400 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .m  { font: 600 11px ui-monospace, Menlo, monospace; }
    .cap { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c2cd; }
    .rule { stroke: #2e3a47; stroke-width: 1; }
    .box { fill: #1b2531; stroke: #3d4956; stroke-width: 1.5; }
    .good { fill: #14301f; stroke: #5cc48a; stroke-width: 1.8; }
    .bad { fill: #2a1a1c; stroke: #e5646c; stroke-width: 1.8; }
    .blue { fill: #16314a; stroke: #5aa9e6; stroke-width: 1.8; }
    .amber { fill: #3a2c14; stroke: #f2a541; stroke-width: 1.8; }
    .purple { fill: #2a2140; stroke: #a98be8; stroke-width: 1.8; }
    .g { fill: #5cc48a; } .r { fill: #e5646c; } .b { fill: #5aa9e6; } .a { fill: #f2a541; } .w { fill: #dfe6ee; } .s { fill: #8a97a6; } .p { fill: #a98be8; }
    .arrow { stroke: #8a97a6; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .arrowb { stroke: #5aa9e6; stroke-width: 1.8; fill: none; marker-end: url(#ahb); }
    .arrowg { stroke: #5cc48a; stroke-width: 1.8; fill: none; marker-end: url(#ahg); }
    .arrowa { stroke: #f2a541; stroke-width: 1.8; fill: none; marker-end: url(#aha); }
    .arrowr { stroke: #e5646c; stroke-width: 1.8; fill: none; marker-end: url(#ahr); }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a97a6"/></marker>
    <marker id="ahb" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5aa9e6"/></marker>
    <marker id="ahg" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5cc48a"/></marker>
    <marker id="aha" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f2a541"/></marker>
    <marker id="ahr" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e5646c"/></marker>
  </defs>

  <rect class="bg" width="800" height="490" rx="6"/>
  <text class="h" x="24" y="34">One question, four helpers</text>
  <text class="t" x="776" y="34" text-anchor="end">WHO DOES WHAT</text>
  <text class="m s" x="24" y="66">you send: "What is the capital of France?"</text>
  <text class="n" x="300" y="92" style="font-size:12px">what it does for your question</text>
  <text class="n" x="560" y="92" style="font-size:12px">take it away and ...</text>
<rect class="blue" x="24" y="104" width="752" height="62" rx="6"/>
  <text class="n b" x="40" y="130">vLLM</text><text class="d" x="40" y="148">the restaurant manager</text>
  <text class="d w" x="300" y="130">takes your question, turns it into tokens,</text><text class="d w" x="300" y="148">says "you run now, your notes go in block 12"</text>
  <text class="d r" x="560" y="130">mlx_lm alone can still answer you, but you</text><text class="d r" x="560" y="148">lose vLLM's scheduler for many users at once</text><rect class="amber" x="24" y="176" width="752" height="62" rx="6"/>
  <text class="n a" x="40" y="202">vllm-metal</text><text class="d" x="40" y="220">the head chef for this kitchen</text>
  <text class="d w" x="300" y="202">takes the manager's plan, packs your tokens</text><text class="d w" x="300" y="220">with other users' tokens, runs the model</text>
  <text class="d r" x="560" y="202">vLLM cannot use the Mac GPU at all.</text><text class="d r" x="560" y="220">at best it runs slowly on the CPU</text><rect class="purple" x="24" y="248" width="752" height="62" rx="6"/>
  <text class="n p" x="40" y="274">mlx_lm</text><text class="d" x="40" y="292">the recipe book</text>
  <text class="d w" x="300" y="274">knows Qwen3-0.6B is 28 layers and how</text><text class="d w" x="300" y="292">each one works. runs them in order</text>
  <text class="d r" x="560" y="274">nobody knows what Qwen or Llama</text><text class="d r" x="560" y="292">looks like inside</text><rect class="good" x="24" y="320" width="752" height="62" rx="6"/>
  <text class="n g" x="40" y="346">MLX + Metal</text><text class="d" x="40" y="364">the stove and oven</text>
  <text class="d w" x="300" y="346">does every multiplication on the Mac GPU,</text><text class="d w" x="300" y="364">in the Mac's shared memory</text>
  <text class="d r" x="560" y="346">nothing actually runs on the GPU</text><text class="d r" x="560" y="364"></text>
  <text class="m g" x="24" y="412">out comes "Paris", and vLLM sends it back to you</text>
  <line class="rule" x1="24" y1="428" x2="776" y2="428"/>
  <text class="cap" x="24" y="452">vLLM knows users but not the Mac GPU. mlx_lm knows models but not users.</text>
  <text class="cap" x="24" y="472">vllm-metal is the one piece that knows both, so it sits in the middle and connects them.</text>
</svg>
