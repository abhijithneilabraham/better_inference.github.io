<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Two ways to use two Macs. Data parallel puts a full copy of the model on each Mac to serve more users. Pipeline parallel splits the layers across Macs to fit a bigger model">
  <style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .n  { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .d  { font: 400 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .m  { font: 600 11px ui-monospace, Menlo, monospace; }
    .cap { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c2cd; }
    .rule { stroke: #2e3a47; stroke-width: 1; }
    .box { fill: #1b2531; stroke: #3d4956; stroke-width: 1.5; }
    .good { fill: #14301f; stroke: #5cc48a; stroke-width: 1.8; }
    .bad { fill: #2a1a1c; stroke: #e5646c; stroke-width: 1.8; }
    .blue { fill: #16314a; stroke: #5aa9e6; stroke-width: 1.8; }
    .amber { fill: #3a2c14; stroke: #f2a541; stroke-width: 1.8; }
    .purple { fill: #2a2140; stroke: #a98be8; stroke-width: 1.8; }
    .g { fill: #5cc48a; } .r { fill: #e5646c; } .b { fill: #5aa9e6; } .a { fill: #f2a541; } .w { fill: #dfe6ee; } .s { fill: #8a97a6; } .p { fill: #a98be8; }
    .arrow { stroke: #8a97a6; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .arrowb { stroke: #5aa9e6; stroke-width: 1.8; fill: none; marker-end: url(#ahb); }
    .arrowg { stroke: #5cc48a; stroke-width: 1.8; fill: none; marker-end: url(#ahg); }
    .arrowa { stroke: #f2a541; stroke-width: 1.8; fill: none; marker-end: url(#aha); }
    .arrowr { stroke: #e5646c; stroke-width: 1.8; fill: none; marker-end: url(#ahr); }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a97a6"/></marker>
    <marker id="ahb" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5aa9e6"/></marker>
    <marker id="ahg" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5cc48a"/></marker>
    <marker id="aha" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f2a541"/></marker>
    <marker id="ahr" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e5646c"/></marker>
  </defs>

  <rect class="bg" width="800" height="380" rx="6"/>
  <text class="h" x="24" y="34">Using more than one Mac</text>
  <text class="t" x="776" y="34" text-anchor="end">DATA vs PIPELINE PARALLEL</text>

  <text class="n g" x="24" y="70">Data parallel: more users</text>
  <text class="d" x="24" y="88">each Mac holds the WHOLE model</text>
  <rect class="box" x="24" y="104" width="160" height="34" rx="5"/><text class="m s" x="104" y="126" text-anchor="middle">requests</text>
  <path class="arrow" d="M 104 140 V 156 H 64 V 168"/><path class="arrow" d="M 104 156 H 144 V 168"/>
  <rect class="good" x="24" y="170" width="84" height="86" rx="5"/><text class="n g" x="66" y="192" text-anchor="middle">Mac A</text><text class="d" x="66" y="214" text-anchor="middle">layers</text><text class="d" x="66" y="230" text-anchor="middle">1 to 32</text>
  <rect class="good" x="116" y="170" width="84" height="86" rx="5"/><text class="n g" x="158" y="192" text-anchor="middle">Mac B</text><text class="d" x="158" y="214" text-anchor="middle">layers</text><text class="d" x="158" y="230" text-anchor="middle">1 to 32</text>
  <text class="d" x="24" y="282">about 2x the users, same max model size</text>
  <text class="d" x="24" y="298">no talking between Macs during a request</text>

  <line x1="400" y1="56" x2="400" y2="310" stroke="#2e3a47"/>

  <text class="n b" x="424" y="70">Pipeline parallel: bigger models</text>
  <text class="d" x="424" y="88">each Mac holds HALF the layers</text>
  <rect class="box" x="424" y="104" width="120" height="34" rx="5"/><text class="m s" x="484" y="126" text-anchor="middle">a request</text>
  <path class="arrow" d="M 484 140 V 168"/>
  <rect class="blue" x="424" y="170" width="120" height="86" rx="5"/><text class="n b" x="484" y="192" text-anchor="middle">Mac A</text><text class="d" x="484" y="214" text-anchor="middle">layers 1 to 16</text><text class="d" x="484" y="230" text-anchor="middle">(reads the words)</text>
  <path class="arrowb" d="M 548 213 H 610"/><text class="m b" x="579" y="204" text-anchor="middle">hidden</text><text class="m b" x="579" y="230" text-anchor="middle">state</text>
  <rect class="blue" x="616" y="170" width="120" height="86" rx="5"/><text class="n b" x="676" y="192" text-anchor="middle">Mac B</text><text class="d" x="676" y="214" text-anchor="middle">layers 17 to 32</text><text class="d" x="676" y="230" text-anchor="middle">(picks the token)</text>
  <text class="d" x="424" y="282">fits a model about 2x bigger</text>
  <text class="d" x="424" y="298">one small hand-off per step, fine over Thunderbolt</text>

  <line class="rule" x1="24" y1="318" x2="776" y2="318"/>
  <text class="cap" x="24" y="344">Ray starts one worker per Mac. The hand-off between Macs uses MLX's own "ring" connection.</text>
  <text class="cap" x="24" y="364">Tensor parallel (splitting every layer across Macs) is not supported, since it needs a very fast link.</text>

</svg>
