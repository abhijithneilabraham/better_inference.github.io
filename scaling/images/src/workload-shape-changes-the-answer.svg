<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Peak input tokens per minute for four different traffic shapes on identical hardware, from 1.88 million on synthetic unique documents to 9.89 million on replayed real conversations">
  <style>
    .bg { fill: #161d26; }
    .h  { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .t  { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; letter-spacing: .06em; }
    .nm { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .ns { font: 400 10.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a97a6; }
    .bar { rx: 3; }
    .b-cold { fill: #e5646c; }
    .b-mid  { fill: #5aa9e6; opacity: .75; }
    .b-hot  { fill: #f2a541; }
    .v { font: 700 13px ui-monospace, Menlo, monospace; fill: #dfe6ee; }
    .vh { fill: #f2a541; }
    .cache { font: 600 11px ui-monospace, Menlo, monospace; fill: #8a97a6; }
    .axis { stroke: #2e3a47; stroke-width: 1; }
    .cap { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b7c2cd; }
    .fail { font: 700 10.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e5646c; }
    .ok { font: 700 10.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5cc48a; }
  </style>
  <rect class="bg" width="800" height="380" rx="6"/>
  <text class="h" x="24" y="34">Same GPUs, same flags, four kinds of traffic</text>
  <text class="t" x="776" y="34" text-anchor="end">PEAK INPUT TOKENS / MIN</text>

  <!-- rows: bar area x from 300 to 700 (400px = 9.89M) -->
  <!-- row 1: synthetic 1.88M -->
  <text class="nm" x="24" y="76">synthetic documents</text>
  <text class="ns" x="24" y="92">every request computed from scratch</text>
  <rect class="bar b-cold" x="300" y="64" width="76" height="30"/>
  <text class="v" x="388" y="85">1.88M</text>
  <text class="cache" x="470" y="85">cache 91.2%</text>
  <text class="fail" x="600" y="85">aborts at ~200 RPM</text>

  <!-- row 2: shared prefix 4.88M -->
  <text class="nm" x="24" y="136">shared 9k prefix</text>
  <text class="ns" x="24" y="152">1k unique tail per session</text>
  <rect class="bar b-mid" x="300" y="124" width="197" height="30"/>
  <text class="v" x="509" y="145">4.88M</text>
  <text class="cache" x="590" y="145">cache 97.6%</text>

  <!-- row 3: replay 60 sessions 9.39M -->
  <text class="nm" x="24" y="196">replayed conversations</text>
  <text class="ns" x="24" y="212">60 real sessions</text>
  <rect class="bar b-hot" x="300" y="184" width="380" height="30" style="opacity:.75"/>
  <text class="v" x="692" y="205">9.39M</text>
  <text class="cache" x="470" y="205" style="fill:#1a1207">cache 98.0%</text>

  <!-- row 4: replay 400 sessions 9.89M -->
  <text class="nm" x="24" y="256">replayed conversations</text>
  <text class="ns" x="24" y="272">400 real sessions, full dataset</text>
  <rect class="bar b-hot" x="300" y="244" width="400" height="30"/>
  <text class="v vh" x="712" y="265">9.89M</text>
  <text class="cache" x="470" y="265" style="fill:#1a1207">cache 96.7%</text>
  <text class="ok" x="600" y="291">full ramp and hold, no abort</text>

  <line class="axis" x1="300" y1="300" x2="700" y2="300"/>

  <text class="cap" x="24" y="332">Nothing about the hardware changed between the top bar and the bottom one. Only how much</text>
  <text class="cap" x="24" y="352">of each request the KV cache had already seen changed. That is a 5x swing in what the</text>
  <text class="cap" x="24" y="372">same machine can absorb, decided entirely by the shape of the traffic.</text>
</svg>
